name: macos-cache-client
description: Run the pinned cache client under a narrower test mode.
inputs:
  mode:
    description: The cache operation to request.
    required: true
  path:
    description: The public fixture path used by the cache operation.
    required: true
  key:
    description: The exact run-scoped public cache key.
    required: true
outputs:
  cache-hit:
    description: Cache client match result
runs:
  using: node24
  main: index.js
