name: source-free-policy
description: Public workflow policy and tree checks
inputs:
  pool:
    description: Public pool label
    required: true
runs:
  using: composite
  steps:
    - name: Check public candidate identity
      shell: bash
      env:
        CI_REPOSITORY: ${{ github.repository }}
        CI_REF: ${{ github.ref }}
        CI_SHA: ${{ github.sha }}
        CI_SERVER_URL: ${{ github.server_url }}
        CI_EVENT_NAME: ${{ github.event_name }}
        CI_ACTION_PATH: ${{ github.action_path }}
        CI_WORKSPACE: ${{ github.workspace }}
        CI_POOL: ${{ inputs.pool }}
      run: |
        set -euo pipefail
        if [[ ! "$CI_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          exit 1
        fi
        if [[ ! "$CI_SHA" =~ ^[a-f0-9]{40}$ ]]; then
          exit 1
        fi
        if [[ ! "$CI_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
          exit 1
        fi
        if [[ -e .git ]]; then
          actual_sha="$(git rev-parse --verify HEAD 2>/dev/null)"
          if [[ "$actual_sha" != "$CI_SHA" ]]; then
            exit 1
          fi
        else
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$CI_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]; then
              exit 1
            fi
            requested_ref="$CI_REF"
          else
            if [[ ! "$CI_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ ]]; then
              exit 1
            fi
            requested_ref="$CI_REF"
          fi
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$requested_ref" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          actual_sha="$(git rev-parse --verify HEAD 2>/dev/null)"
          if [[ "$actual_sha" != "$CI_SHA" ]]; then
            exit 1
          fi
        fi
    - name: Run source-free protocol checks
      shell: bash
      env:
        CI_WORKSPACE: ${{ github.workspace }}
        CI_ACTION_PATH: ${{ github.action_path }}
        CI_SHA: ${{ github.sha }}
        CI_POOL: ${{ inputs.pool }}
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        set -euo pipefail
        if command -v python3 >/dev/null 2>&1; then
          python_bin="$(command -v python3)"
        elif command -v python >/dev/null 2>&1; then
          python_bin="$(command -v python)"
        else
          exit 1
        fi
        "$python_bin" -B "$CI_ACTION_PATH/test_policy.py"
        "$python_bin" -B "$CI_ACTION_PATH/test_public_tree.py"
        "$python_bin" -B -m unittest discover -s "$CI_ACTION_PATH" -p "test_api_controls.py"
        "$python_bin" -B -m unittest discover -s "$CI_ACTION_PATH/../confinement" -p "test_macos*.py"
        "$python_bin" -B -m unittest discover -s "$CI_ACTION_PATH/../confinement" -p "test_confinement*.py"
        "$python_bin" -B -m unittest discover -s "$CI_ACTION_PATH/../confinement" -p "test_log_canary.py"
        if [[ "${RUNNER_OS:-}" == "macOS" ]]; then
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s "$CI_ACTION_PATH/../confinement" -p "test_macos*.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s "$CI_ACTION_PATH/../confinement" -p "test_confinement*.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s "$CI_ACTION_PATH" -p "test_api_controls.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s "$CI_ACTION_PATH/../confinement" -p "test_log_canary.py"
        fi
        "$python_bin" -B "$CI_ACTION_PATH/check_candidate.py" --root "$CI_WORKSPACE" --pool "$CI_POOL" --sha "$CI_SHA"
