name: lane-h-capsule-attester
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
permissions: {}
jobs:
  capsule-attester:
    name: role-capsule-attester-v1
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.profile == 'probe' || inputs.profile == 'production-synthetic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      metadata: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      KD_PROFILE: ${{ inputs.profile }}
      KD_REPOSITORY: ${{ github.repository }}
      KD_SHA: ${{ github.sha }}
      KD_REF: ${{ github.ref }}
      KD_WORKFLOW_REF: ${{ github.workflow_ref }}
      KD_RUNNER: ubuntu-24.04
      KD_RUN_ID: ${{ github.run_id }}
      KD_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout reviewed control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse non-source-free invocation
        run: |
          set -euo pipefail
          [[ "$KD_REPOSITORY" == "keeldock-platform/platform-ci" && "$KD_REF" == "refs/heads/main" && "$KD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$KD_WORKFLOW_REF" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/(windows-source-admission|attestation-role-signer-probe)\.yml@refs/heads/main$ ]]
          [[ "$KD_PROFILE" == "probe" || "$KD_PROFILE" == "production-synthetic" ]]
          if [[ "$KD_PROFILE" == "probe" ]]; then [[ "$KD_WORKFLOW_REF" == *attestation-role-signer-probe.yml@* ]]; else [[ "$KD_WORKFLOW_REF" == *windows-source-admission.yml@* ]]; fi
      - name: Read numeric control repository identifier
        run: |
          set -euo pipefail
          gh api "repos/$KD_REPOSITORY" --jq '.id' > "$RUNNER_TEMP/control-repository-id.txt" 2>/dev/null
          [[ "$(cat "$RUNNER_TEMP/control-repository-id.txt")" =~ ^[1-9][0-9]{0,19}$ ]]
      - name: Download receiver and completed Linux role evidence
        run: |
          set -euo pipefail
          api_path="repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100"
          gh api --paginate --slurp "$api_path" > "$RUNNER_TEMP/artifact-pages.json" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/receiver-record" "$RUNNER_TEMP/linux-statement"
          receiver=$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$RUNNER_TEMP/artifact-pages.json" --role windows-receiver --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" 2>/dev/null)
          linux=$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$RUNNER_TEMP/artifact-pages.json" --role linux-fetch-encrypt --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" 2>/dev/null)
          gh run download "$KD_RUN_ID" --repo "$KD_REPOSITORY" --name "$receiver" --dir "$RUNNER_TEMP/receiver-record" 2>/dev/null
          gh run download "$KD_RUN_ID" --repo "$KD_REPOSITORY" --name "$linux" --dir "$RUNNER_TEMP/linux-statement" 2>/dev/null
          [[ -s "$RUNNER_TEMP/receiver-record/subject.bin" && -s "$RUNNER_TEMP/linux-statement/subject.bin" ]]
      - name: Verify receiver and completed Linux role signatures
        run: |
          set -euo pipefail
          repository_root="https:"'//'"$KD_REPOSITORY"
          gh attestation verify "$RUNNER_TEMP/receiver-record/subject.bin" --bundle "$RUNNER_TEMP/receiver-record/bundle.json" --repo "$KD_REPOSITORY" --signer-workflow "$repository_root/.github/workflows/lane-h-windows-receiver.yml" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json > "$RUNNER_TEMP/receiver-record/verified.json" 2>/dev/null
          gh attestation verify "$RUNNER_TEMP/linux-statement/subject.bin" --bundle "$RUNNER_TEMP/linux-statement/bundle.json" --repo "$KD_REPOSITORY" --signer-workflow "$repository_root/.github/workflows/lane-h-linux-fetch-encrypt.yml" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json > "$RUNNER_TEMP/linux-statement/verified.json" 2>/dev/null
      - name: Recreate and compare the exact synthetic capsule subject
        id: subject
        run: |
          set -euo pipefail
          repository_id="$(cat "$RUNNER_TEMP/control-repository-id.txt")"
          python -B kit/confinement/role_signer.py prepare --profile "$KD_PROFILE" --role capsule-attester --repository "$KD_REPOSITORY" --repository-id "$repository_id" --control-sha "$KD_SHA" --ref "$KD_REF" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --workflow-ref "$KD_WORKFLOW_REF" --runner "$KD_RUNNER" --receiver-record "$RUNNER_TEMP/receiver-record/subject.bin" --output-directory "$RUNNER_TEMP/role-statement"
          cmp "$RUNNER_TEMP/role-statement/subject.bin" "$RUNNER_TEMP/linux-statement/subject.bin"
      - name: Sign only the capsule-attester role statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/role-statement/subject.bin
          predicate-type: https://example.invalid/role-statement/v1
          predicate-path: ${{ runner.temp }}/role-statement/predicate.json
          push-to-registry: false
          create-storage-record: true
          show-summary: false
      - name: Package exact signed statement
        env:
          ROLE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ROLE_BUNDLE"
          cp "$ROLE_BUNDLE" "$RUNNER_TEMP/role-statement/bundle.json"
      - name: Upload exact attester subject, predicate, and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: role-statement-capsule-attester-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.subject.outputs.transfer_id }}
          path: ${{ runner.temp }}/role-statement
          if-no-files-found: error
          retention-days: 1
