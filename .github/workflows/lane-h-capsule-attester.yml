name: lane-h-capsule-attester
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
permissions: {}
jobs:
  capsule-attester:
    name: role-capsule-attester-v1
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.profile == 'probe' || inputs.profile == 'production-synthetic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      KD_PROFILE: ${{ inputs.profile }}
      KD_REPOSITORY: ${{ github.repository }}
      KD_SHA: ${{ github.sha }}
      KD_REF: ${{ github.ref }}
      KD_WORKFLOW_REF: ${{ github.workflow_ref }}
      KD_RUNNER: ubuntu-24.04
      KD_RUN_ID: ${{ github.run_id }}
      KD_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout reviewed control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse non-source-free invocation
        run: |
          set -euo pipefail
          [[ "$KD_REPOSITORY" == "keeldock-platform/platform-ci" && "$KD_REF" == "refs/heads/main" && "$KD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$KD_WORKFLOW_REF" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/(windows-source-admission|attestation-role-signer-probe)\.yml@refs/heads/main$ ]]
          [[ "$KD_PROFILE" == "probe" || "$KD_PROFILE" == "production-synthetic" ]]
          if [[ "$KD_PROFILE" == "probe" ]]; then [[ "$KD_WORKFLOW_REF" == *attestation-role-signer-probe.yml@* ]]; else [[ "$KD_WORKFLOW_REF" == *windows-source-admission.yml@* ]]; fi
      - name: Read numeric control repository identifier
        run: |
          set -euo pipefail
          gh api "repos/$KD_REPOSITORY" --jq '.id' > "$RUNNER_TEMP/control-repository-id.txt" 2>/dev/null
          [[ "$(cat "$RUNNER_TEMP/control-repository-id.txt")" =~ ^[1-9][0-9]{0,19}$ ]]
      - name: Download receiver and completed Linux role evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          mkdir -p "$evidence/artifacts"
          api_path="repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100"
          gh api --paginate --slurp "$api_path" > "$evidence/artifact-pages.json" 2>/dev/null
          for role in windows-receiver linux-fetch-encrypt; do
            name="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field name)"
            identifier="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field id)"
            printf '%s\n' "$name" > "$evidence/$role-name.txt"
            gh api "repos/$KD_REPOSITORY/actions/artifacts/$identifier/zip" > "$evidence/artifacts/$name.zip" 2>/dev/null
            python -B kit/confinement/role_signer.py extract-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --archive-file "$evidence/artifacts/$name.zip" --output-directory "$evidence/artifacts/$name"
          done
      - name: Verify receiver and completed Linux role signatures
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          for role in windows-receiver linux-fetch-encrypt; do
            name="$(cat "$evidence/$role-name.txt")"
            directory="$evidence/artifacts/$name"
            gh attestation verify "$directory/subject.bin" --bundle "$directory/bundle.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/lane-h-$role.yml" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json > "$directory/verified.json" 2>/dev/null
          done
      - name: Recreate and compare the exact synthetic capsule subject
        id: subject
        run: |
          set -euo pipefail
          repository_id="$(cat "$RUNNER_TEMP/control-repository-id.txt")"
          receiver="$(cat "$RUNNER_TEMP/role-evidence/windows-receiver-name.txt")"
          linux="$(cat "$RUNNER_TEMP/role-evidence/linux-fetch-encrypt-name.txt")"
          python -B kit/confinement/role_signer.py prepare --profile "$KD_PROFILE" --role capsule-attester --repository "$KD_REPOSITORY" --repository-id "$repository_id" --control-sha "$KD_SHA" --ref "$KD_REF" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --workflow-ref "$KD_WORKFLOW_REF" --runner "$KD_RUNNER" --receiver-record "$RUNNER_TEMP/role-evidence/artifacts/$receiver/subject.bin" --output-directory "$RUNNER_TEMP/role-statement"
          cmp "$RUNNER_TEMP/role-statement/subject.bin" "$RUNNER_TEMP/role-evidence/artifacts/$linux/subject.bin"
      - name: Apply evidence-backed Gate B before signing the capsule role
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          gh api "repos/$KD_REPOSITORY" --jq '{id:.id,full_name:.full_name,owner_id:.owner.id,visibility:.visibility}' > "$evidence/repository.json" 2>/dev/null
          gh api "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID" > "$evidence/run.json" 2>/dev/null
          gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/attempts/$KD_RUN_ATTEMPT/jobs?per_page=100" > "$evidence/jobs-pages.json" 2>/dev/null
          gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100" > "$evidence/artifact-pages.json" 2>/dev/null
          python -B kit/confinement/role_signer.py wrap-pages --kind jobs --input "$evidence/jobs-pages.json" --output "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py wrap-pages --kind artifacts --input "$evidence/artifact-pages.json" --output "$evidence/artifacts.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          linux_job_id="$(python -B kit/confinement/role_signer.py find-job --profile "$KD_PROFILE" --role linux-fetch-encrypt --jobs-file "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA")"
          gh run view "$KD_RUN_ID" --repo "$KD_REPOSITORY" --job "$linux_job_id" --log > "$evidence/linux.log" 2>/dev/null
          python -B kit/confinement/role_signer.py parse-linux-logs --profile "$KD_PROFILE" --jobs-file "$evidence/jobs.json" --input "$evidence/linux.log" --output "$evidence/linux-logs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py gate-transition --gate B --profile "$KD_PROFILE" --repository "$KD_REPOSITORY" --ref "$KD_REF" --control-sha "$KD_SHA" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --jobs-file "$evidence/jobs.json" --artifacts-file "$evidence/artifacts.json" --repository-metadata "$evidence/repository.json" --run-metadata "$evidence/run.json" --artifact-directory "$evidence/artifacts" --linux-logs "$evidence/linux-logs.json"
      - name: Sign only the capsule-attester role statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/role-statement/subject.bin
          predicate-type: https://example.invalid/role-statement/v1
          predicate-path: ${{ runner.temp }}/role-statement/predicate.json
          push-to-registry: false
          create-storage-record: true
          show-summary: false
      - name: Package exact signed statement
        env:
          ROLE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ROLE_BUNDLE"
          cp "$ROLE_BUNDLE" "$RUNNER_TEMP/role-statement/bundle.json"
      - name: Upload exact attester subject, predicate, and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: role-statement-capsule-attester-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.subject.outputs.transfer_id }}
          path: ${{ runner.temp }}/role-statement
          if-no-files-found: error
          retention-days: 1
