name: lane-h-capsule-attester
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      mode:
        required: false
        type: string
permissions: {}
jobs:
  capsule-attester:
    name: role-capsule-attester-v1
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'candidate' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      KD_PROFILE: ${{ inputs.profile }}
      KD_MODE: ${{ inputs.mode }}
      KD_REPOSITORY: ${{ github.repository }}
      KD_SHA: ${{ github.sha }}
      KD_REF: ${{ github.ref }}
      KD_WORKFLOW_REF: ${{ github.workflow_ref }}
      KD_RUNNER: ubuntu-24.04
      KD_RUN_ID: ${{ github.run_id }}
      KD_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout reviewed control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse unexpected invocation
        run: |
          set -euo pipefail
          [[ "$KD_REPOSITORY" == "keeldock-platform/platform-ci" && "$KD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$KD_PROFILE" == "candidate" && "$KD_RUN_ATTEMPT" == "1" ]]
          [[ "$KD_WORKFLOW_REF" == "$KD_REPOSITORY/.github/workflows/windows-source-admission.yml@$KD_REF" ]]
          if [[ "$KD_MODE" == "synthetic" ]]; then
            [[ "$KD_REF" == "refs/heads/main" ]]
          else
            [[ "$KD_MODE" == "source" && "$KD_REF" == "refs/heads/untrusted" ]]
          fi
      - name: Read numeric control repository identifier
        run: |
          set -euo pipefail
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$RUNNER_TEMP/control-repository-id.txt" -- gh api "repos/$KD_REPOSITORY" --jq '.id'
          [[ "$(cat "$RUNNER_TEMP/control-repository-id.txt")" =~ ^[1-9][0-9]{0,19}$ ]]
      - name: Download receiver, completed Linux role and capsule evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          mkdir -p "$evidence/artifacts" "$evidence/capsules"
          api_path="repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/artifact-pages.json" -- gh api --paginate --slurp "$api_path"
          for role in windows-producer windows-verifier linux-fetch-encrypt; do
            code=0
            name="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field name)" || code=$?
            if [[ "$code" -ne 0 ]]; then printf '%s\n' "${name:0:200}"; printf 'probe=role-signer result=unavailable reason=find-artifact-failed exit=%s role=%s\n' "$code" "$role"; exit 1; fi
            code=0
            identifier="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field id)" || code=$?
            if [[ "$code" -ne 0 ]]; then printf '%s\n' "${identifier:0:200}"; printf 'probe=role-signer result=unavailable reason=find-artifact-failed exit=%s role=%s\n' "$code" "$role"; exit 1; fi
            printf '%s\n' "$name" > "$evidence/$role-name.txt"
            python -B kit/confinement/role_signer.py guard --label artifact-download-failed --output "$evidence/artifacts/$name.zip" -- gh api "repos/$KD_REPOSITORY/actions/artifacts/$identifier/zip"
            python -B kit/confinement/role_signer.py extract-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --archive-file "$evidence/artifacts/$name.zip" --output-directory "$evidence/artifacts/$name"
          done
          for role in producer verifier; do
            capsule_name="source-capsule-$role-$KD_RUN_ID-$KD_RUN_ATTEMPT"
            python3 -B -c 'import json,sys; pages=json.load(open(sys.argv[1], encoding="utf-8")); items=[a for page in pages for a in page.get("artifacts", [])]; found=[a for a in items if a.get("name")==sys.argv[2] and a.get("expired") is False and a.get("workflow_run", {}).get("id")==int(sys.argv[3]) and a.get("workflow_run", {}).get("head_sha")==sys.argv[4]]; print(found[0]["id"]) if len(found)==1 else sys.exit(1)' "$evidence/artifact-pages.json" "$capsule_name" "$KD_RUN_ID" "$KD_SHA" > "$evidence/capsules/$role-id.txt"
            identifier="$(cat "$evidence/capsules/$role-id.txt")"
            [[ "$identifier" =~ ^[1-9][0-9]{0,19}$ ]]
            python -B kit/confinement/role_signer.py guard --label artifact-download-failed --output "$evidence/capsules/$role.zip" -- gh api "repos/$KD_REPOSITORY/actions/artifacts/$identifier/zip"
            mkdir -p "$evidence/capsules/$role"
            unzip -q -d "$evidence/capsules/$role" "$evidence/capsules/$role.zip"
            rm -f "$evidence/capsules/$role.zip"
            [[ "$(find "$evidence/capsules/$role" -type f | wc -l)" == "1" && -f "$evidence/capsules/$role/capsule.bin" && ! -L "$evidence/capsules/$role/capsule.bin" ]]
            [[ "$(stat -c %s "$evidence/capsules/$role/capsule.bin")" == "286261248" ]]
          done
      - name: Verify receiver and completed Linux role signatures
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          for role in windows-producer windows-verifier linux-fetch-encrypt; do
            name="$(cat "$evidence/$role-name.txt")"
            directory="$evidence/artifacts/$name"
            case "$role" in
              windows-*) signer='lane-h-windows-receiver.yml' ;;
              *) signer="lane-h-$role.yml" ;;
            esac
            python -B kit/confinement/role_signer.py guard --label attestation-verify-failed --output "$directory/verified.json" -- gh attestation verify "$directory/subject.bin" --bundle "$directory/bundle.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/$signer" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json
          done
      - name: Recreate and compare the exact capsule binding subject
        id: subject
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          repository_id="$(cat "$RUNNER_TEMP/control-repository-id.txt")"
          producer="$(cat "$evidence/windows-producer-name.txt")"
          verifier="$(cat "$evidence/windows-verifier-name.txt")"
          linux="$(cat "$evidence/linux-fetch-encrypt-name.txt")"
          python -B kit/confinement/role_signer.py prepare --profile "$KD_PROFILE" --role capsule-attester --repository "$KD_REPOSITORY" --repository-id "$repository_id" --control-sha "$KD_SHA" --ref "$KD_REF" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --workflow-ref "$KD_WORKFLOW_REF" --runner "$KD_RUNNER" --receiver-record "$evidence/artifacts/$producer/subject.bin" --verifier-record "$evidence/artifacts/$verifier/subject.bin" --capsule-producer "$evidence/capsules/producer/capsule.bin" --capsule-verifier "$evidence/capsules/verifier/capsule.bin" --linux-subject "$evidence/artifacts/$linux/subject.bin" --output-directory "$RUNNER_TEMP/role-statement"
      - name: Apply evidence-backed Gate B before signing the capsule role
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/repository.json" -- gh api "repos/$KD_REPOSITORY" --jq '{id:.id,full_name:.full_name,owner_id:.owner.id,visibility:.visibility}'
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/run.json" -- gh api "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/jobs-pages.json" -- gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/attempts/$KD_RUN_ATTEMPT/jobs?per_page=100"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/artifact-pages.json" -- gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100"
          python -B kit/confinement/role_signer.py wrap-pages --kind jobs --input "$evidence/jobs-pages.json" --output "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py wrap-pages --kind artifacts --input "$evidence/artifact-pages.json" --output "$evidence/artifacts.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          for role in windows-producer windows-verifier linux-fetch-encrypt; do
            name="$(cat "$evidence/$role-name.txt")"
            directory="$evidence/artifacts/$name"
            subject_sha="$(sha256sum "$directory/subject.bin" | awk '{print $1}')"
            if [[ ! -f "$evidence/provider-$subject_sha.json" ]]; then
              provider_path="repos/$KD_REPOSITORY/attestations/sha256:$subject_sha"
              python -B kit/confinement/role_signer.py guard --label provider-fetch-failed --output "$evidence/provider-$subject_sha-http.txt" -- gh api --include --paginate "$provider_path?per_page=100"
              python -B kit/confinement/role_signer.py wrap-provider-http --input "$evidence/provider-$subject_sha-http.txt" --subject-digest "$subject_sha" --output "$evidence/provider-$subject_sha.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
              python -B kit/confinement/role_signer.py export-provider --snapshot "$evidence/provider-$subject_sha.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --output-directory "$evidence/provider-$subject_sha"
              while read -r index provider_role; do
                case "$provider_role" in
                  windows-*) provider_signer='lane-h-windows-receiver.yml' ;;
                  *) provider_signer="lane-h-$provider_role.yml" ;;
                esac
                python -B kit/confinement/role_signer.py guard --label attestation-verify-failed --output "$evidence/provider-$subject_sha/verified-$index.json" -- gh attestation verify "$directory/subject.bin" --bundle "$evidence/provider-$subject_sha/bundle-$index.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/$provider_signer" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json
              done < "$evidence/provider-$subject_sha/manifest.txt"
            fi
          done
          code=0
          linux_job_id="$(python -B kit/confinement/role_signer.py find-job --observe --profile "$KD_PROFILE" --role linux-fetch-encrypt --jobs-file "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA")" || code=$?
          if [[ "$code" -ne 0 ]]; then printf '%s\n' "${linux_job_id:0:200}"; printf 'probe=role-signer result=unavailable reason=find-job-failed exit=%s\n' "$code"; exit 1; fi
          python -B kit/confinement/role_signer.py guard --label run-view-failed --attempts 5 --pause 6 --output "$evidence/linux.log" --fallback-route "repos/$KD_REPOSITORY/actions/jobs/$linux_job_id/logs" -- gh run view "$KD_RUN_ID" --repo "$KD_REPOSITORY" --job "$linux_job_id" --log
          python -B kit/confinement/role_signer.py parse-linux-logs --observe --profile "$KD_PROFILE" --jobs-file "$evidence/jobs.json" --input "$evidence/linux.log" --output "$evidence/linux-logs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py gate-transition --gate B --observe --observation-output "$evidence/gate-B-observation.json" --profile "$KD_PROFILE" --repository "$KD_REPOSITORY" --ref "$KD_REF" --control-sha "$KD_SHA" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --jobs-file "$evidence/jobs.json" --artifacts-file "$evidence/artifacts.json" --repository-metadata "$evidence/repository.json" --run-metadata "$evidence/run.json" --artifact-directory "$evidence/artifacts" --provider-directory "$evidence" --linux-logs "$evidence/linux-logs.json"
      - name: Sign only the capsule-attester role statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/role-statement/subject.bin
          predicate-type: https://example.invalid/role-statement/v1
          predicate-path: ${{ runner.temp }}/role-statement/predicate.json
          push-to-registry: false
          create-storage-record: true
          show-summary: false
      - name: Package exact signed statement
        env:
          ROLE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ROLE_BUNDLE"
          cp "$ROLE_BUNDLE" "$RUNNER_TEMP/role-statement/bundle.json"
      - name: Upload exact attester subject, predicate, and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: role-statement-capsule-attester-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.subject.outputs.transfer_id }}
          path: ${{ runner.temp }}/role-statement
          if-no-files-found: error
          retention-days: 1
