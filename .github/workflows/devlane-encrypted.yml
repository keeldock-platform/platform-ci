        id: cleanup
        if: ${{ always() }}
        timeout-minutes: 15
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [[ "$DEVLANE_PLATFORM" == "macos" ]]; then
            python_bin="$(python3 -B -c 'import sys; print(sys.executable)')"
            sudo -n "$python_bin" -B kit/devlane/sandbox_macos.py cleanup \
              --state-dir "$RUN_ROOT/state" --root "$RUN_ROOT" --runner-temp "$RUNNER_TEMP" \
              --workspace "$GITHUB_WORKSPACE" --run-id "$CI_RUN_ID"
          elif [[ "$DEVLANE_PLATFORM" == "linux" ]]; then
          node_snapshot_id=""
          node_vendor_id=""
          if [[ "$DEVLANE_PROFILE" == "core-node" ]]; then
            node_snapshot_id="$(printf 'devlane-%s-%s' "$CI_RUN_ID" "$CI_RUN_ATTEMPT")"
          fi
          if [[ "$DEVLANE_PROFILE" == "desktop" ]]; then
            node_vendor_id="$(printf 'devlane-%s-%s' "$CI_RUN_ID" "$CI_RUN_ATTEMPT")"
          fi
          python3 -B kit/devlane/host_cleanup.py --root "$RUN_ROOT" --runner-temp "$RUNNER_TEMP" \
            --deadline-file "$RUN_ROOT/deadline.json" \
            --node-snapshot-id "$node_snapshot_id" --node-vendor-id "$node_vendor_id"
          else
            printf 'cleanup_refusal=runner-unknown\n' >&2
            exit 1
          fi
          printf 'devlane_job=completed public_output=filtered cleanup=confirmed\n'
