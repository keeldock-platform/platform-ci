        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const source = process.env.SOURCE_PATH;
          const controlModule = pathToFileURL(path.join(process.cwd(), 'kit/confinement/node_lock_manifest.mjs')).href;
          try {
            const { validateNpmProjectLock } = await import(controlModule);
            for (const project of [source, path.join(source, 'runtime')]) {
