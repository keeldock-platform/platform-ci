name: core-dependency-checks
run-name: Core dependency checks ${{ inputs.source_sha }}
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact private source commit to check
        required: true
        type: string
      control_sha:
        description: Exact platform control commit to run
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source commit to check
        required: true
        type: string
      control_sha:
        description: Exact platform control commit to run
        required: true
        type: string
permissions: {}
jobs:
  dependency-preflight:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.server_url == 'https://github.com' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')) || (github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') && github.server_url == 'https://github.com' && ((github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'uat' || github.base_ref == 'main') && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge')))) }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') && 'linux-source-read-untrusted' || 'linux-source-read' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the public dispatch inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CONTROL_REF_SHA: ${{ github.sha }}
          REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$REUSABLE_CALL" != "true" ]]; then
            [[ "$CONTROL_SHA" == "$CONTROL_REF_SHA" ]]
          else
            [[ "$SOURCE_SHA" == "$CONTROL_REF_SHA" ]]
          fi
      - name: Checkout pinned platform control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: keeldock-platform/platform-ci
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - name: Verify dispatch freshness and protected source-read settings
        working-directory: control
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REF: ${{ github.ref }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
          CI_SERVER_URL: ${{ github.server_url }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') && 'true' || 'false' }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CACHE_MODE: none
          GITHUB_TOKEN: ${{ github.token }}
          LINUX_SOURCE_ENVIRONMENT_ID: ${{ vars.LINUX_SOURCE_ENVIRONMENT_ID }}
          LINUX_SOURCE_MAIN_BRANCH_POLICY_ID: ${{ vars.LINUX_SOURCE_MAIN_BRANCH_POLICY_ID }}
          LINUX_SOURCE_UNTRUSTED_BRANCH_POLICY_ID: ${{ vars.LINUX_SOURCE_UNTRUSTED_BRANCH_POLICY_ID }}
        run: python3 -B kit/confinement/linux_source_build.py dependency-preflight
  rust:
    needs: dependency-preflight
    if: ${{ always() && needs.dependency-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') && 'linux-source-read-untrusted' || github.repository == 'keeldock-platform/platform-ci' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'linux-source-read-main' || 'linux-source-read' }}
    timeout-minutes: 240
    env:
      KD_REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
      KD_RUST_CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the public dispatch inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CONTROL_REF_SHA: ${{ github.sha }}
          REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$REUSABLE_CALL" != "true" ]]; then
            [[ "$CONTROL_SHA" == "$CONTROL_REF_SHA" ]]
          else
            [[ "$SOURCE_SHA" == "$CONTROL_REF_SHA" ]]
          fi
      - name: Checkout pinned platform control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: keeldock-platform/platform-ci
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - name: Validate the public dispatch and control revisions
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C control rev-parse HEAD)" == "$CONTROL_SHA" ]]
      - name: Install Linux native build prerequisites
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install --no-install-recommends --yes \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - name: Mint a scoped source-reader token
        id: source-reader-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        env:
          SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
        with:
          client-id: ${{ vars.SOURCE_READER_CLIENT_ID }}
          private-key: ${{ env.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true
      - name: Verify the source-reader installation identity
        if: ${{ github.event_name != 'pull_request' }}
        env:
          EXPECTED_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          ACTUAL_INSTALLATION_ID: ${{ steps.source-reader-token.outputs.installation-id }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_REPOSITORY_OWNER: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          SOURCE_REPOSITORY_NAME: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          SOURCE_READER_TOKEN: ${{ steps.source-reader-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]{0,18}$ && "$ACTUAL_INSTALLATION_ID" == "$EXPECTED_INSTALLATION_ID" ]]
          python3 -B control/kit/confinement/linux_source_build.py verify-source-reader
      - name: Verify untrusted Core pull request source without App secrets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B control/kit/confinement/linux_source_build.py verify-source-reader
      - name: Checkout the exact private source commit
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY_OWNER }}/${{ secrets.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ steps.source-reader-token.outputs.token }}
          persist-credentials: false
      - name: Checkout the exact Core pull request commit with the job token
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate the checked-out source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - name: Revoke the source-reader token and verify rejection
        if: ${{ always() && steps.source-reader-token.outputs.token != '' }}
        env:
          SOURCE_READER_TOKEN: ${{ steps.source-reader-token.outputs.token }}
          SOURCE_READER_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          CI_SHA: ${{ github.sha }}
        run: python3 -B control/kit/confinement/linux_source_build.py revoke
      - name: Verify the private source platform pin
        working-directory: source
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
        run: |
          python3 -B - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = {
              "platform_repository": "keeldock-platform/platform-ci",
              "platform_workflow": ".github/workflows/core-dependency-checks.yml",
              "platform_control_sha": os.environ["CONTROL_SHA"],
          }
          actual = tomllib.loads(pathlib.Path("ci/dependency-checks.toml").read_text(encoding="utf-8"))
          if os.environ.get("REUSABLE_CALL") == "true":
              expected.pop("platform_control_sha")
              if {key: actual.get(key) for key in expected} != expected:
                  raise SystemExit("private source platform workflow identity does not match the reusable call")
          elif actual != expected:
              raise SystemExit("private source platform pin does not match the dispatched control")
          PY
      - name: Install the committed pinned Rust toolchain
        id: toolchains
        env:
          KD_BROWSER_TIER: "0"
        run: python3 -B control/kit/confinement/linux_source_build.py toolchains
      - name: Record checked lock and manifest digests
        id: source-inputs
        working-directory: source
        run: |
          set -euo pipefail
          lock_sha256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          runtime_lock_sha256="$(sha256sum runtime/package-lock.json | cut -d ' ' -f 1)"
          manifest_sha256="$(PYTHONPATH="$GITHUB_WORKSPACE/control/kit/confinement" python3 -B -c 'import pathlib,linux_source_build; print(linux_source_build._manifest_digest(pathlib.Path(".")))')"
          printf 'lock_sha256=%s\nruntime_lock_sha256=%s\nmanifest_sha256=%s\n' "$lock_sha256" "$runtime_lock_sha256" "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Derive the exact Rust cache key
        id: rust-cache-key
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          RUST_CACHE_OS: ${{ runner.os }}-${{ runner.arch }}
          RUST_CACHE_SCOPE: rust
          RUST_CACHE_TRUST_CLASS: primary
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: timeout 1m python3 -B kit/confinement/linux_source_build.py rust-cache-key
      - name: Prepare runner-local Rust cache staging
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' }}
        continue-on-error: true
        run: timeout 1m install -d -m 755 "$RUNNER_TEMP/kd-rust-cache/target" "$RUNNER_TEMP/kd-rust-cache/cargo-home/registry" "$RUNNER_TEMP/kd-rust-cache/cargo-home/git"
      - name: Restore the exact Rust build cache
        id: rust-cache
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ${{ runner.temp }}/kd-rust-cache/rust-cache.tar
          key: ${{ steps.rust-cache-key.outputs.cache_key }}
      - name: Import the validated Rust build cache
        id: rust-cache-import
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          KD_RUST_CACHE_MODE: read
          KD_RUST_CACHE_DIR: ${{ runner.temp }}/kd-rust-cache
          KD_RUST_CACHE_KEY: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache-key.outputs.cache_key || '' }}
          KD_RUST_CACHE_HIT: true
          RUST_CACHE_OS: ${{ runner.os }}-${{ runner.arch }}
          RUST_CACHE_SCOPE: rust
          RUST_CACHE_TRUST_CLASS: primary
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
          KD_RUST_CACHE_ENCRYPTION_KEY_B64: ${{ github.repository == 'keeldock-platform/platform-ci' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.RUST_CACHE_ENCRYPTION_KEY || '' }}
        run: timeout 45m python3 -B kit/confinement/linux_source_build.py rust-cache-import
      - name: Fetch Rust sources named by committed lockfiles
        id: cargo-fetch
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          RUST_ROOT: ${{ steps.toolchains.outputs.rust_root }}
          KD_CARGO_FETCH_HOME: ${{ runner.temp }}/kd-cargo-fetch-home
          KD_RUST_CACHE_MODE: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && 'read' || 'none' }}
          KD_RUST_CACHE_DIR: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && format('{0}/kd-rust-cache', runner.temp) || '' }}
          KD_RUST_CACHE_KEY: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache-key.outputs.cache_key || '' }}
          KD_RUST_CACHE_HIT: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && (steps.rust-cache.outputs.cache-hit == 'true' && steps.rust-cache-import.outcome == 'success' && 'true' || 'false') || '' }}
          RUST_CACHE_OS: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && format('{0}-{1}', runner.os, runner.arch) || '' }}
          RUST_CACHE_SCOPE: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && 'rust' || '' }}
          RUST_CACHE_TRUST_CLASS: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && 'primary' || '' }}
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -B control/kit/confinement/linux_source_build.py rust-lock-fetch
      - name: Prepare the immutable source copy for confined builds
        id: project-deps
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          NPM_TARBALL_INDEX: ${{ runner.temp }}/kd-empty-npm-index.json
          RUST_ROOT: ${{ steps.toolchains.outputs.rust_root }}
          KD_CARGO_FETCH_HOME: ${{ steps.cargo-fetch.outputs.cargo_fetch_home }}
          EXPECTED_NODE_LOCK_SHA256: ${{ steps.source-inputs.outputs.lock_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.source-inputs.outputs.manifest_sha256 }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          KD_RUST_CACHE_MODE: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && 'read' || 'none' }}
          KD_RUST_CACHE_DIR: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && format('{0}/kd-rust-cache', runner.temp) || '' }}
          KD_RUST_CACHE_KEY: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache-key.outputs.cache_key || '' }}
          KD_RUST_CACHE_HIT: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && (steps.rust-cache.outputs.cache-hit == 'true' && steps.rust-cache-import.outcome == 'success' && 'true' || 'false') || '' }}
          RUST_CACHE_OS: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && format('{0}-{1}', runner.os, runner.arch) || '' }}
          RUST_CACHE_SCOPE: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && 'rust' || '' }}
          RUST_CACHE_TRUST_CLASS: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && 'primary' || '' }}
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          printf '{}\n' > "$NPM_TARBALL_INDEX"
          sudo -n --preserve-env=SOURCE_PATH,NPM_TARBALL_INDEX,RUST_ROOT,KD_CARGO_FETCH_HOME,EXPECTED_NODE_LOCK_SHA256,EXPECTED_MANIFEST_SHA256,REQUESTED_SOURCE_SHA,RUNNER_TEMP,GITHUB_OUTPUT,KD_RUST_CACHE_MODE,KD_RUST_CACHE_DIR,KD_RUST_CACHE_KEY,KD_RUST_CACHE_HIT,RUST_CACHE_OS,RUST_CACHE_SCOPE,RUST_CACHE_TRUST_CLASS,CI_REPOSITORY,SOURCE_REPOSITORY_ID,CONTROL_SHA,CI_SHA,CI_REF,CI_EVENT_NAME python3 -B control/kit/confinement/linux_source_build.py prepare-project
      - name: Install the official pinned cargo-deny release
        id: cargo-deny
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kd-dependency-tools"
          install -d -m 700 "$root/deny-extract"
          archive="$root/cargo-deny.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$root/deny-extract"
          deny_path="$(find "$root/deny-extract" -type f -name cargo-deny -print -quit)"
          [[ -n "$deny_path" && "$("$deny_path" --version)" == "cargo-deny 0.20.2" ]]
          printf 'path=%s\n' "$deny_path" >> "$GITHUB_OUTPUT"
      - name: Install official pinned cargo-audit and cargo-vet releases
        id: rust-tools
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kd-dependency-tools"
          install -d -m 700 "$root"
          audit_archive="$root/cargo-audit.tgz"
          vet_archive="$root/cargo-vet.tar.xz"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$audit_archive"
          printf '%s  %s\n' ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 "$audit_archive" | sha256sum --check --status
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/mozilla/cargo-vet/releases/download/v0.10.3/cargo-vet-x86_64-unknown-linux-gnu.tar.xz \
            --output "$vet_archive"
          printf '%s  %s\n' e83878b80913fbe43629c28768e14ab51f4e86a4ba8f9dd08cc25b8dbc503c19 "$vet_archive" | sha256sum --check --status
          install -d -m 700 "$root/audit-extract" "$root/vet-extract"
          tar -xzf "$audit_archive" -C "$root/audit-extract"
          tar -xJf "$vet_archive" -C "$root/vet-extract"
          audit_path="$(find "$root/audit-extract" -type f -name cargo-audit -print -quit)"
          vet_path="$(find "$root/vet-extract" -type f -name cargo-vet -print -quit)"
          [[ -n "$audit_path" && -n "$vet_path" ]]
          printf 'audit=%s\n' "$audit_path" >> "$GITHUB_OUTPUT"
          printf 'vet=%s\n' "$vet_path" >> "$GITHUB_OUTPUT"
      - name: Check all committed Cargo locks with cargo-deny
        timeout-minutes: 100
        env:
          SOURCE_PATH: ${{ steps.project-deps.outputs.worker_path }}
          CARGO_DENY: ${{ steps.cargo-deny.outputs.path }}
          RUST_ROOT: ${{ steps.toolchains.outputs.rust_root }}
          CARGO_HOME: ${{ runner.temp }}/kd-cargo-deny-home
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          try {
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, 'control/kit/confinement/node_lock_manifest.mjs');
            const { captureDependencyCheck, formatDependencyCheckSummary } = await import(pathToFileURL(helperPath).href);
            const source = process.env.SOURCE_PATH;
            const env = { ...process.env, PATH: `${process.env.RUST_ROOT}/bin:${process.env.PATH}` };
            let failed = false;
            for (const [name, manifest] of [['root', 'Cargo.toml'], ['fuzz', 'fuzz/Cargo.toml'], ['runtime', 'runtime/Cargo.toml']]) {
              if (!fs.existsSync(path.join(source, manifest))) continue;
              const result = await captureDependencyCheck({
                check: `cargo-deny-${name}`,
                command: process.env.CARGO_DENY,
                args: ['--manifest-path', path.join(source, manifest), '--config', path.join(source, 'deny.toml'), '--workspace', '--all-features', 'check'],
                cwd: source,
                env,
                timeoutMs: 30 * 60 * 1000,
              });
              console.log(formatDependencyCheckSummary(result));
              if (result.status !== 'passed') failed = true;
            }
            if (failed) process.exitCode = 1;
          } catch {
            console.log('KD-DEPENDENCY-RESULT check=cargo-deny-wrapper status=failed advisory-count=0 advisory-ids=none');
            process.exitCode = 1;
          }
          NODE
      - name: Audit all committed Cargo locks against a fresh RustSec database
        timeout-minutes: 50
        env:
          SOURCE_PATH: ${{ steps.project-deps.outputs.worker_path }}
          CARGO_AUDIT: ${{ steps.rust-tools.outputs.audit }}
          CARGO_HOME: ${{ runner.temp }}/kd-cargo-audit-home
        run: |
          set -euo pipefail
          install -d -m 700 "$CARGO_HOME"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          try {
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, 'control/kit/confinement/node_lock_manifest.mjs');
            const { captureDependencyCheck, formatDependencyCheckSummary } = await import(pathToFileURL(helperPath).href);
            const source = process.env.SOURCE_PATH;
            let failed = false;
            for (const [name, lockfile] of [['root', 'Cargo.lock'], ['runtime', 'runtime/Cargo.lock'], ['fuzz', 'fuzz/Cargo.lock']]) {
              if (!fs.existsSync(path.join(source, lockfile))) continue;
              const result = await captureDependencyCheck({
                check: `cargo-audit-${name}`,
                command: process.env.CARGO_AUDIT,
                args: ['audit', '--file', path.join(source, lockfile)],
                cwd: source,
                env: process.env,
                timeoutMs: 15 * 60 * 1000,
              });
              console.log(formatDependencyCheckSummary(result));
              if (result.status !== 'passed') failed = true;
            }
            if (failed) process.exitCode = 1;
          } catch {
            console.log('KD-DEPENDENCY-RESULT check=cargo-audit-wrapper status=failed advisory-count=0 advisory-ids=none');
            process.exitCode = 1;
          }
          NODE
      - name: Check cargo-vet trusted imports and recorded exemptions
        timeout-minutes: 30
        env:
          SOURCE_PATH: ${{ steps.project-deps.outputs.worker_path }}
          RUST_ROOT: ${{ steps.toolchains.outputs.rust_root }}
          CARGO: ${{ steps.toolchains.outputs.rust_root }}/bin/cargo
          CARGO_VET: ${{ steps.rust-tools.outputs.vet }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          export PATH="$RUST_ROOT/bin:$PATH"
          store_root="$RUNNER_TEMP/kd-cargo-vet-stores"
          cargo_home="$RUNNER_TEMP/kd-cargo-vet-home"
          install -d -m 700 "$store_root/root" "$store_root/fuzz" "$store_root/runtime" "$cargo_home"
          cp -R "$SOURCE_PATH/supply-chain/." "$store_root/root/" >/dev/null 2>&1 || { printf 'KD-DEPENDENCY-RESULT check=cargo-vet-setup status=failed\n'; exit 1; }
          cp -R "$SOURCE_PATH/supply-chain/." "$store_root/fuzz/" >/dev/null 2>&1 || { printf 'KD-DEPENDENCY-RESULT check=cargo-vet-setup status=failed\n'; exit 1; }
          cp -R "$SOURCE_PATH/runtime/supply-chain/." "$store_root/runtime/" >/dev/null 2>&1 || { printf 'KD-DEPENDENCY-RESULT check=cargo-vet-setup status=failed\n'; exit 1; }
          registry_cache="$SOURCE_PATH/.kd-cargo-home/registry"
          if [[ -d "$registry_cache" && ! -L "$registry_cache" ]]; then
            cp -R "$registry_cache" "$cargo_home/" >/dev/null 2>&1 || { printf 'KD-DEPENDENCY-RESULT check=cargo-vet-setup status=failed\n'; exit 1; }
          fi
          printf '\n' > "$cargo_home/config.toml"
          export CARGO_HOME="$cargo_home"
          export CARGO_NET_OFFLINE=true
          cd "$SOURCE_PATH"
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          try {
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, 'control/kit/confinement/node_lock_manifest.mjs');
            const { captureDependencyCheck, formatDependencyCheckSummary } = await import(pathToFileURL(helperPath).href);
            const source = process.env.SOURCE_PATH;
            const checks = [
              ['cargo-vet-root', [process.env.CARGO_VET, 'vet', 'check', '--locked', '--store-path', path.join(process.env.RUNNER_TEMP, 'kd-cargo-vet-stores/root')]],
              ['cargo-vet-fuzz', [process.env.CARGO_VET, 'vet', 'check', '--manifest-path', path.join(source, 'fuzz/Cargo.toml'), '--store-path', path.join(process.env.RUNNER_TEMP, 'kd-cargo-vet-stores/fuzz'), '--locked']],
              ['cargo-vet-runtime', [process.env.CARGO_VET, 'vet', 'check', '--manifest-path', path.join(source, 'runtime/Cargo.toml'), '--store-path', path.join(process.env.RUNNER_TEMP, 'kd-cargo-vet-stores/runtime'), '--locked']],
            ];
            let failed = false;
            for (const [check, [command, ...args]] of checks) {
              const result = await captureDependencyCheck({ check, command, args, cwd: source, env: process.env, timeoutMs: 8 * 60 * 1000 });
              console.log(formatDependencyCheckSummary(result));
              if (result.status !== 'passed') failed = true;
            }
            if (failed) process.exitCode = 1;
          } catch {
            console.log('KD-DEPENDENCY-RESULT check=cargo-vet-wrapper status=failed advisory-count=0 advisory-ids=none');
            process.exitCode = 1;
          }
          NODE
      - name: Harden runner paths before confined project checks
        working-directory: control
        timeout-minutes: 5
        run: sudo -n python3 -B kit/confinement/linux_boundary.py harden --runner-uid "$(id -u)" --runner-home "$HOME" --runner-temp "$RUNNER_TEMP"
      - name: Prepare kernel restrictions and run the independent boundary self-test
        id: selftest
        working-directory: control
        timeout-minutes: 15
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          KD_CANARY_SECRET: kd-synthetic-standin-NOT-A-SECRET-0123456789abcdef0123456789abcd
          KD_RUST_SYSROOT: ${{ steps.toolchains.outputs.rust_sysroot }}
          KD_NODE_BIN: ${{ steps.toolchains.outputs.node_bin }}
        run: |
          set -euo pipefail
          arguments=(--control-sha "$CONTROL_SHA" --runner-uid "$(id -u)" --runner-home "$HOME" --runner-temp "$RUNNER_TEMP" --rust-sysroot "$KD_RUST_SYSROOT" --node-bin "$KD_NODE_BIN" --synthetic-standin)
          sudo -n --preserve-env=KD_CANARY_SECRET python3 -B kit/confinement/linux_boundary.py selftest "${arguments[@]}" --record "$RUNNER_TEMP/kd-records/selftest.json"
      - name: Re-run positive controls immediately before confined Rust checks
        id: recheck
        working-directory: control
        timeout-minutes: 15
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          KD_CANARY_SECRET: kd-synthetic-standin-NOT-A-SECRET-0123456789abcdef0123456789abcd
          KD_RUST_SYSROOT: ${{ steps.toolchains.outputs.rust_sysroot }}
          KD_NODE_BIN: ${{ steps.toolchains.outputs.node_bin }}
        run: |
          set -euo pipefail
          arguments=(--control-sha "$CONTROL_SHA" --runner-uid "$(id -u)" --runner-home "$HOME" --runner-temp "$RUNNER_TEMP" --rust-sysroot "$KD_RUST_SYSROOT" --node-bin "$KD_NODE_BIN" --synthetic-standin)
          sudo -n --preserve-env=KD_CANARY_SECRET python3 -B kit/confinement/linux_boundary.py recheck "${arguments[@]}" --record "$RUNNER_TEMP/kd-records/recheck.json"
      - name: Build and test root and fuzz Rust workspaces with locks enforced
        id: confined-builds
        timeout-minutes: 115
        working-directory: control
        env:
          RUST_ROOT: ${{ steps.toolchains.outputs.rust_root }}
          WORKER_PATH: ${{ steps.project-deps.outputs.worker_path }}
          CARGO_HOME: ${{ steps.project-deps.outputs.cargo_home }}
        run: |
          set -euo pipefail
          sudo -n --preserve-env=WORKER_PATH,CARGO_HOME,RUST_ROOT,RUNNER_TEMP python3 -B kit/confinement/linux_source_build.py dependency-locked-builds
      - name: Verify both confinement phases
        if: ${{ always() && steps.selftest.outcome != 'skipped' && steps.recheck.outcome != 'skipped' }}
        working-directory: control
        run: sudo -n python3 -B kit/confinement/linux_boundary.py merge --selftest "$RUNNER_TEMP/kd-records/selftest.json" --recheck "$RUNNER_TEMP/kd-records/recheck.json" --out "$RUNNER_TEMP/kd-records/merged.json"
      - name: Prepare the Rust cache after confined work exits
        id: rust-cache-export
        if: ${{ success() && steps.confined-builds.outcome == 'success' && env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && (steps.rust-cache.outputs.cache-hit != 'true' || steps.rust-cache-import.outcome != 'success') && ((github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.ref == 'refs/heads/main')) }}
        continue-on-error: true
        timeout-minutes: 15
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          WORKER_PATH: ${{ steps.project-deps.outputs.worker_path }}
          CARGO_HOME: ${{ steps.project-deps.outputs.cargo_home }}
          KD_RUST_CACHE_MODE: read
          KD_RUST_CACHE_DIR: ${{ runner.temp }}/kd-rust-cache
          KD_RUST_CACHE_KEY: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache-key.outputs.cache_key || '' }}
          KD_RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
          RUST_CACHE_OS: ${{ runner.os }}-${{ runner.arch }}
          RUST_CACHE_SCOPE: rust
          RUST_CACHE_TRUST_CLASS: primary
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: timeout 10m sudo -n --preserve-env=SOURCE_PATH,WORKER_PATH,CARGO_HOME,RUNNER_TEMP,KD_RUST_CACHE_MODE,KD_RUST_CACHE_DIR,KD_RUST_CACHE_KEY,KD_RUST_CACHE_HIT,RUST_CACHE_OS,RUST_CACHE_SCOPE,RUST_CACHE_TRUST_CLASS,CI_REPOSITORY,SOURCE_REPOSITORY_ID,REQUESTED_SOURCE_SHA,CONTROL_SHA,CI_SHA,CI_REF,CI_EVENT_NAME python3 -B kit/confinement/linux_source_build.py rust-cache-export
      - name: Package the Rust build cache
        id: rust-cache-package
        if: ${{ success() && (steps.rust-cache.outputs.cache-hit != 'true' || steps.rust-cache-import.outcome != 'success') && steps.rust-cache-export.outcome == 'success' && env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.ref == 'refs/heads/main')) }}
        continue-on-error: true
        timeout-minutes: 50
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          KD_RUST_CACHE_MODE: read
          KD_RUST_CACHE_DIR: ${{ runner.temp }}/kd-rust-cache
          KD_RUST_CACHE_KEY: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache-key.outputs.cache_key || '' }}
          KD_RUST_CACHE_HIT: false
          RUST_CACHE_OS: ${{ runner.os }}-${{ runner.arch }}
          RUST_CACHE_SCOPE: rust
          RUST_CACHE_TRUST_CLASS: primary
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
          KD_RUST_CACHE_ENCRYPTION_KEY_B64: ${{ github.repository == 'keeldock-platform/platform-ci' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.RUST_CACHE_ENCRYPTION_KEY || '' }}
        run: timeout 45m python3 -B kit/confinement/linux_source_build.py rust-cache-package
      - name: Save the Rust build cache for protected main
        continue-on-error: true
        if: ${{ success() && (steps.rust-cache.outputs.cache-hit != 'true' || steps.rust-cache-import.outcome != 'success') && steps.rust-cache-package.outcome == 'success' && env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.ref == 'refs/heads/main')) }}
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ runner.temp }}/kd-rust-cache/rust-cache.tar
          key: ${{ steps.rust-cache-key.outputs.cache_key }}
  runtime-workspace:
    name: core.runtime.workspace
    needs: dependency-preflight
    if: ${{ always() && needs.dependency-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') && 'linux-source-read-untrusted' || github.repository == 'keeldock-platform/platform-ci' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'linux-source-read-main' || 'linux-source-read' }}
    timeout-minutes: 180
    env:
      KD_REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
      KD_RUST_CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the public dispatch inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CONTROL_REF_SHA: ${{ github.sha }}
          REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$REUSABLE_CALL" != "true" ]]; then
            [[ "$CONTROL_SHA" == "$CONTROL_REF_SHA" ]]
          else
            [[ "$SOURCE_SHA" == "$CONTROL_REF_SHA" ]]
          fi
      - name: Checkout pinned platform control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: keeldock-platform/platform-ci
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - name: Validate the public dispatch and control revisions
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C control rev-parse HEAD)" == "$CONTROL_SHA" ]]
      - name: Install Linux native build prerequisites
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install --no-install-recommends --yes \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - name: Mint a scoped source-reader token
        if: ${{ github.event_name != 'pull_request' }}
        id: source-reader-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        env:
          SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
        with:
          client-id: ${{ vars.SOURCE_READER_CLIENT_ID }}
          private-key: ${{ env.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true
      - name: Verify the source-reader installation identity
        if: ${{ github.event_name != 'pull_request' }}
        env:
          EXPECTED_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          ACTUAL_INSTALLATION_ID: ${{ steps.source-reader-token.outputs.installation-id }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_REPOSITORY_OWNER: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          SOURCE_REPOSITORY_NAME: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          SOURCE_READER_TOKEN: ${{ steps.source-reader-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]{0,18}$ && "$ACTUAL_INSTALLATION_ID" == "$EXPECTED_INSTALLATION_ID" ]]
          python3 -B control/kit/confinement/linux_source_build.py verify-source-reader
      - name: Verify untrusted Core pull request source without App secrets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B control/kit/confinement/linux_source_build.py verify-source-reader
      - name: Checkout the exact private source commit
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY_OWNER }}/${{ secrets.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ steps.source-reader-token.outputs.token }}
          persist-credentials: false
      - name: Checkout the exact Core pull request commit with the job token
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate the checked-out source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - name: Revoke the source-reader token and verify rejection
        if: ${{ always() && steps.source-reader-token.outputs.token != '' }}
        env:
          SOURCE_READER_TOKEN: ${{ steps.source-reader-token.outputs.token }}
          SOURCE_READER_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          CI_SHA: ${{ github.sha }}
        run: python3 -B control/kit/confinement/linux_source_build.py revoke
      - name: Verify the private source platform pin
        working-directory: source
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          REUSABLE_CALL: ${{ github.repository == format('{0}/{1}-{2}', 'Moh-Bakr', 'keeldock', 'core') }}
        run: |
          python3 -B - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = {
              "platform_repository": "keeldock-platform/platform-ci",
              "platform_workflow": ".github/workflows/core-dependency-checks.yml",
              "platform_control_sha": os.environ["CONTROL_SHA"],
          }
          actual = tomllib.loads(pathlib.Path("ci/dependency-checks.toml").read_text(encoding="utf-8"))
          if os.environ.get("REUSABLE_CALL") == "true":
              expected.pop("platform_control_sha")
              if {key: actual.get(key) for key in expected} != expected:
                  raise SystemExit("private source platform workflow identity does not match the reusable call")
          elif actual != expected:
              raise SystemExit("private source platform pin does not match the dispatched control")
          PY
      - name: Validate npm lock origins and clear project npm configuration
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const source = process.env.SOURCE_PATH;
          const controlModule = pathToFileURL(path.join(process.cwd(), 'kit/confinement/node_lock_manifest.mjs')).href;
          try {
            const { validateNpmProjectLock } = await import(controlModule);
            for (const project of [source, path.join(source, 'runtime')]) {
              validateNpmProjectLock(source, project);
            }
          } catch {
            console.log('KD-NPM-LOCK-VALIDATION status=failed');
            process.exit(1);
          }
          console.log('KD-NPM-LOCK-VALIDATION status=passed roots=2');
          NODE
      - name: Record checked lock and manifest digests
        id: source-inputs
        working-directory: source
        timeout-minutes: 5
        run: |
          set -euo pipefail
          lock_sha256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          runtime_lock_sha256="$(sha256sum runtime/package-lock.json | cut -d ' ' -f 1)"
          manifest_sha256="$(PYTHONPATH="$GITHUB_WORKSPACE/control/kit/confinement" python3 -B -c 'import pathlib,linux_source_build; print(linux_source_build._manifest_digest(pathlib.Path(".")))')"
          printf 'lock_sha256=%s\nruntime_lock_sha256=%s\nmanifest_sha256=%s\n' "$lock_sha256" "$runtime_lock_sha256" "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Install the committed pinned Rust and Node toolchains
        id: toolchains
        timeout-minutes: 30
        env:
          KD_BROWSER_TIER: "0"
        run: python3 -B control/kit/confinement/linux_source_build.py toolchains
      - name: Derive the exact Rust cache key
        id: rust-cache-key
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          RUST_CACHE_OS: ${{ runner.os }}-${{ runner.arch }}
          RUST_CACHE_SCOPE: runtime-workspace
          RUST_CACHE_TRUST_CLASS: primary
          CI_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: timeout 1m python3 -B kit/confinement/linux_source_build.py rust-cache-key
      - name: Prepare runner-local Rust cache staging
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' }}
        continue-on-error: true
        run: timeout 1m install -d -m 755 "$RUNNER_TEMP/kd-rust-cache/target" "$RUNNER_TEMP/kd-rust-cache/cargo-home/registry" "$RUNNER_TEMP/kd-rust-cache/cargo-home/git"
      - name: Restore the exact Rust build cache
        id: rust-cache
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ runner.temp }}/kd-rust-cache/rust-cache.tar
          key: ${{ steps.rust-cache-key.outputs.cache_key }}
      - name: Import the validated Rust build cache
        id: runtime-cache-import
        if: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        working-directory: control
        env:
          SOURCE_PATH: ${{ github.workspace }}/source
          KD_RUST_CACHE_MODE: read
          KD_RUST_CACHE_DIR: ${{ runner.temp }}/kd-rust-cache
          KD_RUST_CACHE_KEY: ${{ env.KD_RUST_CACHE_ENABLED == 'true' && steps.rust-cache-key.outcome == 'success' && steps.rust-cache-key.outputs.cache_key || '' }}
          KD_RUST_CACHE_HIT: true
          RUST_CACHE_OS: ${{ runner.os }}-${{ runner.arch }}
