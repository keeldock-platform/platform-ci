            const checks = [
              ['npm-root-ci', ['ci', '--ignore-scripts', '--no-audit', '--registry=https://registry.npmjs.org/', '--replace-registry-host=never', '--proxy=', '--https-proxy=']],
              ['npm-root-audit', ['audit', '--audit-level=high', '--json', '--registry=https://registry.npmjs.org/', '--replace-registry-host=never', '--proxy=', '--https-proxy=']],
              ['npm-root-signatures', ['audit', 'signatures', '--registry=https://registry.npmjs.org/', '--replace-registry-host=never', '--proxy=', '--https-proxy=']],
            ];
            let failed = false;
