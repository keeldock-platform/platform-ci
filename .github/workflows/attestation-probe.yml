name: attestation-probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  require-main:
    name: require-main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse any event or ref other than manual main
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -ne 'workflow_dispatch' -or $env:EVENT_REF -ne 'refs/heads/main') {
            Write-Output 'probe=refused reason=trigger'
            exit 1
          }
          Write-Output 'probe=ref-check status=passed'
      - name: Checkout public workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the source-free verifier helper
        run: python3 -B kit/confinement/test_attestation_probe.py
      - name: Prepare verifier helper artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'attestation-probe-helper'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath 'kit/confinement/attestation_probe.py' -Destination (Join-Path $target 'attestation_probe.py')
      - name: Upload verifier helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-probe-helper-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-probe-helper/attestation_probe.py
          if-no-files-found: error
          retention-days: 1

  attest-proposed:
    name: attest-proposed-${{ matrix.runner }}
    needs: require-main
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    env:
      PROBE_RUNNER: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create fixed synthetic subject
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'attestation-probe'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $subject = Join-Path $directory 'subject.bin'
          $bytes = [System.Text.Encoding]::ASCII.GetBytes(("attestation probe subject v1`nrun=" + $env:GITHUB_RUN_ID + "`nrun_attempt=" + $env:GITHUB_RUN_ATTEMPT + "`njob=" + $env:GITHUB_JOB + "`nrunner=" + $env:PROBE_RUNNER + "`n"))
          [System.IO.File]::WriteAllBytes($subject, $bytes)
      - name: Create signed statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-probe/subject.bin
          predicate-type: https://example.invalid/attestation-probe/v1
          predicate: '{"probe":"source-free-attestation-probe-v1"}'
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Package signed statement
        shell: pwsh
        env:
          PROBE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROBE_BUNDLE)) { throw 'bundle-unavailable' }
          $directory = Join-Path $env:RUNNER_TEMP 'attestation-probe-package'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'attestation-probe/subject.bin') -Destination (Join-Path $directory 'subject.bin')
          Copy-Item -LiteralPath $env:PROBE_BUNDLE -Destination (Join-Path $directory 'bundle.json')
      - name: Upload signed statement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-proposed-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-probe-package
          if-no-files-found: error
          retention-days: 1

  attest-minimal:
    name: attest-minimal-${{ matrix.runner }}
    needs: require-main
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
    env:
      PROBE_RUNNER: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create fixed synthetic subject
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'attestation-probe'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $subject = Join-Path $directory 'subject.bin'
          $bytes = [System.Text.Encoding]::ASCII.GetBytes(("attestation probe subject v1`nrun=" + $env:GITHUB_RUN_ID + "`nrun_attempt=" + $env:GITHUB_RUN_ATTEMPT + "`njob=" + $env:GITHUB_JOB + "`nrunner=" + $env:PROBE_RUNNER + "`n"))
          [System.IO.File]::WriteAllBytes($subject, $bytes)
      - name: Create signed statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-probe/subject.bin
          predicate-type: https://example.invalid/attestation-probe/v1
          predicate: '{"probe":"source-free-attestation-probe-v1"}'
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Package signed statement
        shell: pwsh
        env:
          PROBE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROBE_BUNDLE)) { throw 'bundle-unavailable' }
          $directory = Join-Path $env:RUNNER_TEMP 'attestation-probe-package'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'attestation-probe/subject.bin') -Destination (Join-Path $directory 'subject.bin')
          Copy-Item -LiteralPath $env:PROBE_BUNDLE -Destination (Join-Path $directory 'bundle.json')
      - name: Upload signed statement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-minimal-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-probe-package
          if-no-files-found: error
          retention-days: 1

  without-id-token:
    name: without-id-token-${{ matrix.runner }}
    needs: require-main
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      attestations: write
    env:
      PROBE_RUNNER: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create fixed synthetic subject
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'attestation-probe'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $subject = Join-Path $directory 'subject.bin'
          $bytes = [System.Text.Encoding]::ASCII.GetBytes(("attestation probe subject v1`nrun=" + $env:GITHUB_RUN_ID + "`nrun_attempt=" + $env:GITHUB_RUN_ATTEMPT + "`njob=" + $env:GITHUB_JOB + "`nrunner=" + $env:PROBE_RUNNER + "`n"))
          [System.IO.File]::WriteAllBytes($subject, $bytes)
      - name: Attempt signed statement without identity token permission
        id: attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-probe/subject.bin
          predicate-type: https://example.invalid/attestation-probe/v1
          predicate: '{"probe":"source-free-attestation-probe-v1"}'
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Require reduced permission refusal
        if: always()
        shell: pwsh
        env:
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
        run: |
          if ($env:ATTEST_OUTCOME -ne 'failure') { throw 'identity-token-permission-not-required' }
          Write-Output 'permission-probe=denied missing=id-token:write'

  without-attestations:
    name: without-attestations-${{ matrix.runner }}
    needs: require-main
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      PROBE_RUNNER: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create fixed synthetic subject
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'attestation-probe'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $subject = Join-Path $directory 'subject.bin'
          $bytes = [System.Text.Encoding]::ASCII.GetBytes(("attestation probe subject v1`nrun=" + $env:GITHUB_RUN_ID + "`nrun_attempt=" + $env:GITHUB_RUN_ATTEMPT + "`njob=" + $env:GITHUB_JOB + "`nrunner=" + $env:PROBE_RUNNER + "`n"))
          [System.IO.File]::WriteAllBytes($subject, $bytes)
      - name: Attempt signed statement without attestation permission
        id: attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-probe/subject.bin
          predicate-type: https://example.invalid/attestation-probe/v1
          predicate: '{"probe":"source-free-attestation-probe-v1"}'
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Require reduced permission refusal
        if: always()
        shell: pwsh
        env:
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
        run: |
          if ($env:ATTEST_OUTCOME -ne 'failure') { throw 'attestations-permission-not-required' }
          Write-Output 'permission-probe=denied missing=attestations:write'

  verify:
    name: verify-statements
    if: ${{ always() && needs.require-main.result == 'success' }}
    needs:
      - require-main
      - attest-proposed
      - attest-minimal
      - without-id-token
      - without-attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_RUN_ID: ${{ github.run_id }}
      GH_RUN_ATTEMPT: ${{ github.run_attempt }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      GH_SERVER_URL: ${{ github.server_url }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify signed statements and negative cases
        env:
          PROPOSED_RESULT: ${{ needs.attest-proposed.result }}
          MINIMAL_RESULT: ${{ needs.attest-minimal.result }}
          NO_ID_TOKEN_RESULT: ${{ needs.without-id-token.result }}
          NO_ATTESTATIONS_RESULT: ${{ needs.without-attestations.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "::add-mask::$env:GH_TOKEN"
          $mapping = 'unavailable'
          $ubuntuPermissions = 'unavailable'
          $windowsPermissions = 'unavailable'
          try {
            if ($env:EVENT_NAME -ne 'workflow_dispatch' -or $env:EVENT_REF -ne 'refs/heads/main') { throw 'trigger' }
            if ($env:GH_SERVER_URL -ne 'https://github.com') { throw 'issuer-origin' }
            if ($env:PROPOSED_RESULT -ne 'success' -or $env:MINIMAL_RESULT -ne 'success' -or $env:NO_ID_TOKEN_RESULT -ne 'success' -or $env:NO_ATTESTATIONS_RESULT -ne 'success') { throw 'permission-matrix' }
            $ubuntuPermissions = 'attestations:write,id-token:write'
            $windowsPermissions = 'attestations:write,id-token:write'
            if ($env:GH_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'repository' }
            $root = Join-Path $env:RUNNER_TEMP 'attestation-probe-verification'
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $helperArtifact = Join-Path $root 'helper'
            New-Item -ItemType Directory -Path $helperArtifact -Force | Out-Null
            $helperArtifactName = "attestation-probe-helper-$env:GH_RUN_ATTEMPT"
            & gh run download $env:GH_RUN_ID --repo $env:GH_REPOSITORY --name $helperArtifactName --dir $helperArtifact 1>$null 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'helper-artifact' }
            $helper = Join-Path $helperArtifact 'attestation_probe.py'
            $jobsFile = Join-Path $root 'jobs.json'
            & gh api "repos/$env:GH_REPOSITORY/actions/runs/$env:GH_RUN_ID/attempts/$env:GH_RUN_ATTEMPT/jobs?per_page=100" 1> $jobsFile 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'jobs-api' }
            $jobNames = @(
              'attest-proposed-ubuntu-24.04',
              'attest-proposed-windows-2025',
              'attest-minimal-ubuntu-24.04',
              'attest-minimal-windows-2025'
            )
            $jobIds = @{}
            foreach ($jobName in $jobNames) {
              $jobId = & python3 $helper job-id --jobs-file $jobsFile --name $jobName
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($jobId | Out-String).Trim())) { throw 'job-id' }
              $jobIds[$jobName] = ($jobId | Out-String).Trim()
            }
            $statementSpecs = @(
              @{ artifact = "probe-proposed-ubuntu-24.04-$env:GH_RUN_ATTEMPT"; label = 'proposed-ubuntu'; job = 'attest-proposed-ubuntu-24.04'; job_key = 'attest-proposed'; runner = 'ubuntu-24.04' },
              @{ artifact = "probe-proposed-windows-2025-$env:GH_RUN_ATTEMPT"; label = 'proposed-windows'; job = 'attest-proposed-windows-2025'; job_key = 'attest-proposed'; runner = 'windows-2025' },
              @{ artifact = "probe-minimal-ubuntu-24.04-$env:GH_RUN_ATTEMPT"; label = 'minimal-ubuntu'; job = 'attest-minimal-ubuntu-24.04'; job_key = 'attest-minimal'; runner = 'ubuntu-24.04' },
              @{ artifact = "probe-minimal-windows-2025-$env:GH_RUN_ATTEMPT"; label = 'minimal-windows'; job = 'attest-minimal-windows-2025'; job_key = 'attest-minimal'; runner = 'windows-2025' }
            )
            $verifiedFiles = @{}
            foreach ($entry in $statementSpecs) {
              $artifactName = $entry.artifact
              $directory = Join-Path $root $artifactName
              New-Item -ItemType Directory -Path $directory -Force | Out-Null
              & gh run download $env:GH_RUN_ID --repo $env:GH_REPOSITORY --name $artifactName --dir $directory 1>$null 2>$null
              if ($LASTEXITCODE -ne 0) { throw 'statement-artifact' }
              $subject = Join-Path $directory 'subject.bin'
              $bundle = Join-Path $directory 'bundle.json'
              $verified = Join-Path $directory 'verified.json'
              $subjectInfo = Get-Item -LiteralPath $subject
              $bundleInfo = Get-Item -LiteralPath $bundle
              if ($subjectInfo.Length -gt 256 -or $bundleInfo.Length -le 0 -or $bundleInfo.Length -gt 1048576) { throw 'subject-or-bundle-size' }
              $expectedText = "attestation probe subject v1`nrun=$env:GH_RUN_ID`nrun_attempt=$env:GH_RUN_ATTEMPT`njob=$($entry.job_key)`nrunner=$($entry.runner)`n"
              $expectedBytes = [System.Text.Encoding]::ASCII.GetBytes($expectedText)
              $actualBytes = [System.IO.File]::ReadAllBytes($subject)
              if ([Convert]::ToBase64String($actualBytes) -cne [Convert]::ToBase64String($expectedBytes)) { throw 'subject-mismatch' }
              & gh attestation verify $subject --bundle $bundle --repo $env:GH_REPOSITORY --signer-workflow "$env:GH_REPOSITORY/.github/workflows/attestation-probe.yml" --predicate-type 'https://example.invalid/attestation-probe/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json 1> $verified 2>$null
              if ($LASTEXITCODE -ne 0) { throw 'signature-verification' }
              $verifiedFiles[$entry.label] = $verified
              $digest = (Get-FileHash -LiteralPath $subject -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Output "probe=verified-subject runner=$($entry.label) sha256=$digest claims=audience,issuer,job_id,run_attempt,run_id"
            }
            $commonArguments = @('--audience', 'sigstore', '--issuer', 'https://token.actions.githubusercontent.com', '--run-id', $env:GH_RUN_ID, '--run-attempt', $env:GH_RUN_ATTEMPT)
            $mapResults = @{}
            foreach ($entry in $statementSpecs) {
              $result = & python3 $helper evaluate --verified-file $verifiedFiles[$entry.label] @commonArguments --job-id $jobIds[$entry.job]
              if ($LASTEXITCODE -ne 0) { throw 'claim-evaluation' }
              $mapResults[$entry.label] = ($result | Out-String).Trim()
            }
            if (@($mapResults.Values | Where-Object { $_ -notmatch '^mapping=available claims=audience,issuer,job_id,run_attempt,run_id$' }).Count -gt 0) { throw 'claims-unavailable' }
            $ubuntuTamperSubject = Join-Path $root 'tampered-subject.bin'
            $minimalUbuntuArtifact = "probe-minimal-ubuntu-24.04-$env:GH_RUN_ATTEMPT"
            Copy-Item -LiteralPath (Join-Path (Join-Path $root $minimalUbuntuArtifact) 'subject.bin') -Destination $ubuntuTamperSubject
            [System.IO.File]::AppendAllText($ubuntuTamperSubject, 'tampered', [System.Text.Encoding]::ASCII)
            & gh attestation verify $ubuntuTamperSubject --bundle (Join-Path (Join-Path $root $minimalUbuntuArtifact) 'bundle.json') --repo $env:GH_REPOSITORY --signer-workflow "$env:GH_REPOSITORY/.github/workflows/attestation-probe.yml" --predicate-type 'https://example.invalid/attestation-probe/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) { throw 'tampered-subject-accepted' }
            $crossJob = & python3 $helper evaluate --verified-file $verifiedFiles['minimal-ubuntu'] @commonArguments --job-id $jobIds['attest-minimal-windows-2025']
            if ($LASTEXITCODE -ne 0 -or ($crossJob | Out-String).Trim() -notmatch '^mapping=mismatch claims=audience,issuer,job_id,run_attempt,run_id$') { throw 'cross-job-not-rejected' }
            $otherAttempt = if ($env:GH_RUN_ATTEMPT -eq '1') { '2' } else { [string]([int]$env:GH_RUN_ATTEMPT + 1) }
            $attemptCheck = & python3 $helper evaluate --verified-file $verifiedFiles['minimal-ubuntu'] --audience 'sigstore' --issuer 'https://token.actions.githubusercontent.com' --run-id $env:GH_RUN_ID --run-attempt $otherAttempt --job-id $jobIds['attest-minimal-ubuntu-24.04']
            if ($LASTEXITCODE -ne 0 -or ($attemptCheck | Out-String).Trim() -notmatch '^mapping=mismatch claims=audience,issuer,job_id,run_attempt,run_id$') { throw 'attempt-not-distinguished' }
            $mapping = 'available'
          } catch {
            $mapping = 'unavailable'
          }
          Write-Output "KD-ATTESTATION-PROBE mapping=$mapping"
          Write-Output "minimal_permissions[ubuntu-24.04]=$ubuntuPermissions"
          Write-Output "minimal_permissions[windows-2025]=$windowsPermissions"
          Write-Output 'verifier_permissions=actions:read,attestations:read'
          if ($mapping -ne 'available') { exit 1 }
