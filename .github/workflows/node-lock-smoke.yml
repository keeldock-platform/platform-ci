name: node-lock-smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  promotion-check-reuse:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      statuses: read
    outputs:
      skip_checks: ${{ steps.decide.outputs.skip_checks }}
    steps:
      - name: Fetch the exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check prior workflow results for this exact SHA
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_TARGET: ${{ github.ref_name }}
          PROMOTION_SHA: ${{ github.sha }}
          PROMOTION_WORKFLOW: node-lock-smoke
        run: timeout 1m python -B kit/promotion/branch_promotion.py --reuse-checks-if-green --target "$PROMOTION_TARGET" --sha "$PROMOTION_SHA" --workflow "$PROMOTION_WORKFLOW"
  node-lock-smoke:
    name: node-lock-smoke-${{ matrix.runner }}
    needs: promotion-check-reuse
    if: ${{ always() && (needs.promotion-check-reuse.result == 'skipped' || needs.promotion-check-reuse.outputs.skip_checks != 'true') }}
    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Fetch public candidate
        run: |
          set -euo pipefail
          if [[ "$CI_EVENT_NAME" != "push" && "$CI_EVENT_NAME" != "workflow_dispatch" && "$CI_EVENT_NAME" != "pull_request" ]]; then
            exit 1
          fi
          if [[ ! "$CI_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            exit 1
          fi
          if [[ ! "$CI_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            exit 1
          fi
          if [[ ! "$CI_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            exit 1
          fi
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$CI_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]; then
              exit 1
            fi
          else
            if [[ ! "$CI_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ ]]; then
              exit 1
            fi
          fi
          requested_ref="$CI_REF"
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$requested_ref" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          actual_sha="$(git rev-parse --verify HEAD 2>/dev/null)"
          if [[ "$actual_sha" != "$CI_SHA" ]]; then
            exit 1
          fi
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Run source-free helper tests
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v24.22.1" ]]
          [[ "$(npm --version)" == "11.19.1" ]]
          node --test kit/confinement/test_node_lock_envelope.mjs kit/confinement/test_node_lock_manifest.mjs
          python_command=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_command=python
          fi
          "$python_command" -B -m unittest discover -s kit/confinement -p "test_node_lock_receipt.py"
          "$python_command" -B -m unittest discover -s kit/confinement -p "test_sbom_normalizer.py"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_sbom_normalizer.py"
          fi
