name: windows-handoff-synthetic
on:
  workflow_call:
permissions: {}
jobs:
  handoff-unit:
    name: handoff-unit-${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch public candidate
        run: |
          set -euo pipefail
          [[ "$CI_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$CI_REPOSITORY" == "keeldock-platform/platform-ci" ]]
          [[ "$CI_SERVER_URL" == "https://github.com" ]]
          [[ "$CI_REF" =~ ^refs/heads/[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$CI_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$CI_SHA" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          actual_sha="$(git rev-parse --verify HEAD 2>/dev/null)"
          if [[ "$actual_sha" != "$CI_SHA" ]]; then
            exit 1
          fi
      - name: Run handoff scanner and synthetic tree tests
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python_bin="$(command -v python3)"
          elif command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          else
            exit 1
          fi
          "$python_bin" -B kit/handoff/test_source_free.py
      - name: Generate local synthetic tree
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python_bin="$(command -v python3)"
          elif command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          else
            exit 1
          fi
          "$python_bin" -B kit/handoff/source_free.py create --root "$RUNNER_TEMP/synthetic-handoff-tree"
