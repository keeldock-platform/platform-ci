name: lane-h-linux-fetch-encrypt
on:
  workflow_call:
    secrets:
      SOURCE_READER_PRIVATE_KEY:
        required: false
      SOURCE_REPOSITORY_OWNER:
        required: false
      SOURCE_REPOSITORY_NAME:
        required: false
    inputs:
      profile:
        required: true
        type: string
      mode:
        required: false
        type: string
      source_sha:
        required: false
        type: string
        default: ''
      base_sha:
        required: false
        type: string
        default: ''
      base_branch:
        required: false
        type: string
        default: ''
      fingerprint:
        required: false
        type: string
        default: ''
      environment_name:
        required: false
        type: string
        default: ''
permissions: {}
jobs:
  linux-fetch-encrypt:
    name: role-linux-fetch-encrypt-v1
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'candidate' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.mode == 'source' && 'linux-source-read' || '' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      KD_PROFILE: ${{ inputs.profile }}
      KD_MODE: ${{ inputs.mode }}
      KD_REPOSITORY: ${{ github.repository }}
      KD_SHA: ${{ github.sha }}
      KD_REF: ${{ github.ref }}
      KD_WORKFLOW_REF: ${{ github.workflow_ref }}
      KD_RUNNER: ubuntu-24.04
      KD_RUN_ID: ${{ github.run_id }}
      KD_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_MODE: ${{ inputs.mode }}
      CI_WORKSPACE: ${{ github.workspace }}
      CACHE_MODE: none
      KD_SOURCE_PREFIX: WINDOWS_SOURCE
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
      REQUESTED_BASE_BRANCH: ${{ inputs.base_branch }}
      REQUESTED_FINGERPRINT: ${{ inputs.fingerprint }}
      REQUESTED_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
      SOURCE_REPOSITORY_OWNER: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
      SOURCE_REPOSITORY_NAME: ${{ secrets.SOURCE_REPOSITORY_NAME }}
      SOURCE_READER_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
      SOURCE_READER_CLIENT_ID: ${{ vars.SOURCE_READER_CLIENT_ID }}
      LINUX_SOURCE_ENVIRONMENT_NAME: ${{ vars.LINUX_SOURCE_ENVIRONMENT_NAME }}
      WINDOWS_SOURCE_ENVIRONMENT_NAME: ${{ vars.WINDOWS_SOURCE_ENVIRONMENT_NAME }}
      WINDOWS_SOURCE_ALLOWED_SHA: ${{ vars.WINDOWS_SOURCE_ALLOWED_SHA }}
      WINDOWS_SOURCE_ALLOWED_BASE_SHA: ${{ vars.WINDOWS_SOURCE_ALLOWED_BASE_SHA }}
      WINDOWS_SOURCE_ALLOWED_BASE_BRANCH: ${{ vars.WINDOWS_SOURCE_ALLOWED_BASE_BRANCH }}
      WINDOWS_SOURCE_ALLOWED_FINGERPRINT: ${{ vars.WINDOWS_SOURCE_ALLOWED_FINGERPRINT }}
      WINDOWS_SOURCE_ALLOWED_CONTROL_SHA: ${{ vars.WINDOWS_SOURCE_ALLOWED_CONTROL_SHA }}
    steps:
      - name: Checkout reviewed control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse unexpected invocation
        run: |
          set -euo pipefail
          [[ "$KD_REPOSITORY" == "keeldock-platform/platform-ci" && "$CI_SERVER_URL" == "https://github.com" && "$KD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$KD_PROFILE" == "candidate" && "$KD_RUN_ATTEMPT" == "1" ]]
          [[ "$KD_WORKFLOW_REF" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/windows-source-admission\.yml@refs/heads/(main|untrusted)$ ]]
          [[ "$KD_WORKFLOW_REF" == "$KD_REPOSITORY/.github/workflows/windows-source-admission.yml@$KD_REF" ]]
          if [[ "$KD_MODE" == "synthetic" ]]; then
            [[ "$KD_REF" == "refs/heads/main" ]]
          else
            [[ "$KD_MODE" == "source" && "$KD_REF" == "refs/heads/untrusted" ]]
            [[ "$REQUESTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$REQUESTED_ENVIRONMENT_NAME" == "linux-source-read" ]]
          fi
      - name: Repeat preflight in source-read
        if: ${{ inputs.mode == 'source' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B kit/confinement/linux_source_build.py windows-preflight
      - name: Read numeric control repository identifier
        run: |
          set -euo pipefail
          gh api "repos/$KD_REPOSITORY" --jq '.id' > "$RUNNER_TEMP/control-repository-id.txt" 2>/dev/null
          [[ "$(cat "$RUNNER_TEMP/control-repository-id.txt")" =~ ^[1-9][0-9]{0,19}$ ]]
      - name: Record image and fetch pinned toolchains
        id: toolchains
        if: ${{ inputs.mode == 'source' }}
        run: python3 -B kit/confinement/linux_source_build.py toolchains
      - name: Wait for both exact current-attempt receiver artifacts
        run: |
          set -euo pipefail
          api_path="repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100"
          evidence="$RUNNER_TEMP/role-evidence"
          mkdir -p "$evidence/artifacts"
          for role in windows-producer windows-verifier; do
            selected=''
            for _ in $(seq 1 120); do
              if gh api --paginate --slurp "$api_path" > "$evidence/artifact-pages.json" 2>/dev/null; then
                if selected="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field name 2>/dev/null)"; then break; fi
              fi
              selected=''
              sleep 5
            done
            [[ -n "$selected" ]]
            printf '%s\n' "$selected" > "$evidence/$role-name.txt"
            identifier="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field id)"
            gh api "repos/$KD_REPOSITORY/actions/artifacts/$identifier/zip" > "$evidence/artifacts/$selected.zip" 2>/dev/null
            python -B kit/confinement/role_signer.py extract-artifact --artifacts-file "$evidence/artifact-pages.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --archive-file "$evidence/artifacts/$selected.zip" --output-directory "$evidence/artifacts/$selected"
          done
      - name: Verify receiver bundles and apply evidence-backed Gate A
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/role-evidence"
          signer_file() {
            case "$1" in
              windows-*) printf 'lane-h-windows-receiver.yml' ;;
              *) printf 'lane-h-%s.yml' "$1" ;;
            esac
          }
          gh api "repos/$KD_REPOSITORY" --jq '{id:.id,full_name:.full_name,owner_id:.owner.id,visibility:.visibility}' > "$evidence/repository.json" 2>/dev/null
          gh api "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID" > "$evidence/run.json" 2>/dev/null
          gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/attempts/$KD_RUN_ATTEMPT/jobs?per_page=100" > "$evidence/jobs-pages.json" 2>/dev/null
          gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100" > "$evidence/artifact-pages.json" 2>/dev/null
          python -B kit/confinement/role_signer.py wrap-pages --kind jobs --input "$evidence/jobs-pages.json" --output "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py wrap-pages --kind artifacts --input "$evidence/artifact-pages.json" --output "$evidence/artifacts.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          for role in windows-producer windows-verifier; do
            selected="$(cat "$evidence/$role-name.txt")"
            directory="$evidence/artifacts/$selected"
            gh attestation verify "$directory/subject.bin" --bundle "$directory/bundle.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/$(signer_file "$role")" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json > "$directory/verified.json" 2>/dev/null
            subject_sha="$(sha256sum "$directory/subject.bin" | awk '{print $1}')"
            provider_path="repos/$KD_REPOSITORY/attestations/sha256:$subject_sha"
            gh api --include --paginate "$provider_path?per_page=100" > "$evidence/provider-$subject_sha-http.txt" 2>/dev/null
            python -B kit/confinement/role_signer.py wrap-provider-http --input "$evidence/provider-$subject_sha-http.txt" --subject-digest "$subject_sha" --output "$evidence/provider-$subject_sha.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
            python -B kit/confinement/role_signer.py export-provider --snapshot "$evidence/provider-$subject_sha.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --output-directory "$evidence/provider-$subject_sha"
            while read -r index provider_role; do
              gh attestation verify "$directory/subject.bin" --bundle "$evidence/provider-$subject_sha/bundle-$index.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/$(signer_file "$provider_role")" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json > "$evidence/provider-$subject_sha/verified-$index.json" 2>/dev/null
            done < "$evidence/provider-$subject_sha/manifest.txt"
          done
          python -B kit/confinement/role_signer.py gate-transition --gate A --observe --observation-output "$evidence/gate-A-observation.json" --profile "$KD_PROFILE" --repository "$KD_REPOSITORY" --ref "$KD_REF" --control-sha "$KD_SHA" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --jobs-file "$evidence/jobs.json" --artifacts-file "$evidence/artifacts.json" --repository-metadata "$evidence/repository.json" --run-metadata "$evidence/run.json" --artifact-directory "$evidence/artifacts" --provider-directory "$evidence"
      - name: Mint scoped source-reader token
        id: source-reader-token
        if: ${{ inputs.mode == 'source' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        env:
          SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
        with:
          client-id: ${{ vars.SOURCE_READER_CLIENT_ID }}
          private-key: ${{ env.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true
      - name: Verify selected installation identity
        if: ${{ inputs.mode == 'source' }}
        env:
          EXPECTED_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          ACTUAL_INSTALLATION_ID: ${{ steps.source-reader-token.outputs.installation-id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$ACTUAL_INSTALLATION_ID" =~ ^[1-9][0-9]{0,18}$ && "$ACTUAL_INSTALLATION_ID" == "$EXPECTED_INSTALLATION_ID" ]]
          printf '%s\n' "linux-source-installation=verified id=$ACTUAL_INSTALLATION_ID"
      - name: Fetch exact source and verify binding, tree, signatures and lock provenance
        id: checkout
        if: ${{ inputs.mode == 'source' }}
        env:
          SOURCE_READER_TOKEN: ${{ steps.source-reader-token.outputs.token }}
        run: python3 -B kit/confinement/linux_source_build.py checkout
      - name: handoff-revoke-source-token-v1
        id: revoke-source-token
        if: ${{ always() && (inputs.mode == 'synthetic' || steps.source-reader-token.outputs.token != '') }}
        env:
          SOURCE_READER_TOKEN: ${{ steps.source-reader-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ "$KD_MODE" == "source" ]]; then
            python3 -B kit/confinement/linux_source_build.py revoke
          else
            printf '%s\n' 'probe=source-free-revocation-simulation status=passed'
          fi
      - name: handoff-verify-token-rejection-v1
        id: verify-token-rejection
        run: |
          set -euo pipefail
          if [[ "$KD_MODE" == "source" ]]; then
            receipt="$RUNNER_TEMP/kd-records/revocation.json"
            [[ -f "$receipt" && ! -L "$receipt" ]]
            python3 -B -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="ascii")); sys.exit(0 if r.get("status")=="confirmed" and r.get("rejected_after_revoke") is True and r.get("schema_version")==1 else 1)' "$receipt"
          else
            printf '%s\n' 'probe=source-free-revocation-simulation result=synthetic'
          fi
          printf '%s\n' 'handoff-revocation=confirmed'
      - name: Install the pinned hash-checked sealer dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps --target "$RUNNER_TEMP/kd-pydeps" -r kit/handoff/provider_requirements.txt
          PYTHONPATH="$RUNNER_TEMP/kd-pydeps" python3 -B -c 'import cryptography.hazmat.primitives.asymmetric.ec, cryptography.hazmat.primitives.ciphers.aead'
      - name: Build the two receiver-bound source capsules
        id: capsule
        env:
          SOURCE_PATH: ${{ steps.checkout.outputs.source_path }}
          CHECKOUT_LOCK_SHA256: ${{ steps.checkout.outputs.lock_sha256 }}
          CHECKOUT_MANIFEST_SHA256: ${{ steps.checkout.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          evidence="$RUNNER_TEMP/role-evidence"
          if [[ "$KD_MODE" == "source" ]]; then
            repository="$SOURCE_PATH"
            source_sha="$REQUESTED_SOURCE_SHA"
            source_repository_id="$SOURCE_REPOSITORY_ID"
            lock_sha256="$CHECKOUT_LOCK_SHA256"
            manifest_sha256="$CHECKOUT_MANIFEST_SHA256"
          else
            fixture="kit/confinement/synthetic_project"
            [[ -d "$fixture" && ! -L "$fixture" ]]
            repository="$RUNNER_TEMP/synthetic-source"
            mkdir -p "$repository"
            cp -R "$fixture/." "$repository/"
            git -C "$repository" init --quiet
            git -C "$repository" add --all
            GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' git -C "$repository" -c user.name=fixture -c user.email=fixture@example.invalid -c commit.gpgsign=false commit --quiet --no-verify -m fixture
            source_sha="$(git -C "$repository" rev-parse --verify HEAD)"
            source_repository_id=1
            lock_sha256="$(sha256sum "$repository/package-lock.json" | awk '{print $1}')"
            manifest_sha256="$(python3 -B kit/confinement/gate_table.py manifest-digest --root "$repository")"
          fi
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ && "$source_repository_id" =~ ^[1-9][0-9]{0,19}$ && "$lock_sha256" =~ ^[a-f0-9]{64}$ && "$manifest_sha256" =~ ^[a-f0-9]{64}$ ]]
          git -c core.hooksPath=/dev/null -C "$repository" update-ref refs/heads/kd-source "$source_sha"
          bundle="$RUNNER_TEMP/source.bundle"
          git -c core.hooksPath=/dev/null -C "$repository" bundle create "$bundle" refs/heads/kd-source
          [[ "$(stat -c %s "$bundle")" -le 268435448 ]]
          mkdir -p "$RUNNER_TEMP/source-capsule-summaries"
          for role in producer verifier; do
            selected="$(cat "$evidence/windows-$role-name.txt")"
            mkdir -p "$RUNNER_TEMP/source-capsule-$role"
            PYTHONPATH="$RUNNER_TEMP/kd-pydeps" python3 -B kit/handoff/source_capsule.py seal --repository "$repository" --source-sha "$source_sha" --source-repository-id "$source_repository_id" --bundle "$bundle" --key-record "$evidence/artifacts/$selected/subject.bin" --output "$RUNNER_TEMP/source-capsule-$role/capsule.bin" --summary "$RUNNER_TEMP/source-capsule-summaries/$role.json"
          done
          rm -f "$bundle"
          python3 -B -c 'import json,sys; a,b,c,d,e,f=sys.argv[1:7]; x=json.load(open(a,encoding="ascii")); y=json.load(open(b,encoding="ascii")); ok=x["source_sha"]==y["source_sha"]==c and x["tree_id"]==y["tree_id"] and len(x["tree_id"])==40 and len(d)==64 and len(e)==64; open(f,"a",encoding="ascii").write("source_sha="+x["source_sha"]+"\ntree_id="+x["tree_id"]+"\nlock_sha256="+d+"\nmanifest_sha256="+e+"\n") if ok else sys.exit(1)' "$RUNNER_TEMP/source-capsule-summaries/producer.json" "$RUNNER_TEMP/source-capsule-summaries/verifier.json" "$source_sha" "$lock_sha256" "$manifest_sha256" "$GITHUB_OUTPUT"
      - name: Create the linux-fetch-encrypt role statement
        id: subject
        env:
          CAPSULE_SOURCE_SHA: ${{ steps.capsule.outputs.source_sha }}
          CAPSULE_TREE_ID: ${{ steps.capsule.outputs.tree_id }}
          CAPSULE_LOCK_SHA256: ${{ steps.capsule.outputs.lock_sha256 }}
          CAPSULE_MANIFEST_SHA256: ${{ steps.capsule.outputs.manifest_sha256 }}
          CHECKOUT_TREE_ID: ${{ steps.checkout.outputs.source_tree }}
          CHECKOUT_LOCK_SHA256: ${{ steps.checkout.outputs.lock_sha256 }}
          CHECKOUT_MANIFEST_SHA256: ${{ steps.checkout.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CAPSULE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$CAPSULE_TREE_ID" =~ ^[a-f0-9]{40}$ && "$CAPSULE_LOCK_SHA256" =~ ^[a-f0-9]{64}$ && "$CAPSULE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$KD_MODE" == "source" ]]; then
            [[ "$CAPSULE_SOURCE_SHA" == "$REQUESTED_SOURCE_SHA" && "$CAPSULE_TREE_ID" == "$CHECKOUT_TREE_ID" && "$CAPSULE_LOCK_SHA256" == "$CHECKOUT_LOCK_SHA256" && "$CAPSULE_MANIFEST_SHA256" == "$CHECKOUT_MANIFEST_SHA256" ]]
          fi
          repository_id="$(cat "$RUNNER_TEMP/control-repository-id.txt")"
          evidence="$RUNNER_TEMP/role-evidence"
          producer="$(cat "$evidence/windows-producer-name.txt")"
          verifier="$(cat "$evidence/windows-verifier-name.txt")"
          arguments=(--receiver-record "$evidence/artifacts/$producer/subject.bin" --verifier-record "$evidence/artifacts/$verifier/subject.bin" --capsule-producer "$RUNNER_TEMP/source-capsule-producer/capsule.bin" --capsule-verifier "$RUNNER_TEMP/source-capsule-verifier/capsule.bin" --source-sha "$CAPSULE_SOURCE_SHA" --tree-id "$CAPSULE_TREE_ID" --lock-sha256 "$CAPSULE_LOCK_SHA256" --manifest-sha256 "$CAPSULE_MANIFEST_SHA256")
          if [[ "$KD_MODE" == "source" ]]; then
            arguments+=(--revocation-receipt "$RUNNER_TEMP/kd-records/revocation.json")
          fi
          python -B kit/confinement/role_signer.py prepare --profile "$KD_PROFILE" --role linux-fetch-encrypt --repository "$KD_REPOSITORY" --repository-id "$repository_id" --control-sha "$KD_SHA" --ref "$KD_REF" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --workflow-ref "$KD_WORKFLOW_REF" --runner "$KD_RUNNER" --output-directory "$RUNNER_TEMP/role-statement" "${arguments[@]}"
      - name: Sign only the linux-fetch-encrypt role statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/role-statement/subject.bin
          predicate-type: https://example.invalid/role-statement/v1
          predicate-path: ${{ runner.temp }}/role-statement/predicate.json
          push-to-registry: false
          create-storage-record: true
          show-summary: false
      - name: Package exact signed statement
        env:
          ROLE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ROLE_BUNDLE"
          cp "$ROLE_BUNDLE" "$RUNNER_TEMP/role-statement/bundle.json"
      - name: Upload exact Linux subject, predicate, and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: role-statement-linux-fetch-encrypt-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.subject.outputs.transfer_id }}
          path: ${{ runner.temp }}/role-statement
          if-no-files-found: error
          retention-days: 1
      - name: Upload the producer source capsule
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-capsule-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-capsule-producer/capsule.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload the verifier source capsule
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-capsule-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-capsule-verifier/capsule.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
