  compare-probe-results:
    name: compare-profile-results
    if: always()
    needs:
      - require-reviewed-main
      - common-intersection-ubuntu
      - common-intersection-windows
      - github-guide-ubuntu
      - github-guide-windows
      - actions-readme-ubuntu
      - actions-readme-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: pwsh
    env:
      MAIN_GUARD: ${{ needs.require-reviewed-main.result }}
      COMMON_UBUNTU_JOB_RESULT: ${{ needs.common-intersection-ubuntu.result }}
      COMMON_WINDOWS_JOB_RESULT: ${{ needs.common-intersection-windows.result }}
      GUIDE_UBUNTU_JOB_RESULT: ${{ needs.github-guide-ubuntu.result }}
      GUIDE_WINDOWS_JOB_RESULT: ${{ needs.github-guide-windows.result }}
      README_UBUNTU_JOB_RESULT: ${{ needs.actions-readme-ubuntu.result }}
      README_WINDOWS_JOB_RESULT: ${{ needs.actions-readme-windows.result }}
      COMMON_UBUNTU: ${{ needs.common-intersection-ubuntu.outputs.result }}
      COMMON_WINDOWS: ${{ needs.common-intersection-windows.outputs.result }}
      GUIDE_UBUNTU: ${{ needs.github-guide-ubuntu.outputs.result }}
      GUIDE_WINDOWS: ${{ needs.github-guide-windows.outputs.result }}
      README_UBUNTU: ${{ needs.actions-readme-ubuntu.outputs.result }}
      README_WINDOWS: ${{ needs.actions-readme-windows.outputs.result }}
    steps:
      - name: Refuse comparison after workflow cancellation
        if: cancelled()
        run: |
          Write-Output 'probe=profile-comparison result=blocked reason=workflow-cancelled'
          exit 1
      - name: Compare only classified arm results
        if: ${{ success() && !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MAIN_GUARD -ne 'success') {
            Write-Output 'probe=profile-comparison result=blocked reason=main-guard'
            exit 1
          }
          $jobResults = [ordered]@{
            common_intersection_ubuntu = $env:COMMON_UBUNTU_JOB_RESULT
            common_intersection_windows = $env:COMMON_WINDOWS_JOB_RESULT
            github_guide_ubuntu = $env:GUIDE_UBUNTU_JOB_RESULT
            github_guide_windows = $env:GUIDE_WINDOWS_JOB_RESULT
            actions_readme_ubuntu = $env:README_UBUNTU_JOB_RESULT
            actions_readme_windows = $env:README_WINDOWS_JOB_RESULT
          }
          foreach ($entry in $jobResults.GetEnumerator()) {
            if ($entry.Value -ne 'success') {
              Write-Output 'probe=profile-comparison result=blocked reason=arm-job-not-success'
              exit 1
            }
          }
          $results = [ordered]@{
            common_intersection_ubuntu = $env:COMMON_UBUNTU
            common_intersection_windows = $env:COMMON_WINDOWS
            github_guide_ubuntu = $env:GUIDE_UBUNTU
            github_guide_windows = $env:GUIDE_WINDOWS
            actions_readme_ubuntu = $env:README_UBUNTU
            actions_readme_windows = $env:README_WINDOWS
          }
          foreach ($entry in $results.GetEnumerator()) {
            if ($entry.Value -notin @('verified', 'unverified', 'error')) {
              Write-Output 'probe=profile-comparison result=blocked reason=missing-or-invalid-arm-result'
              exit 1
            }
          }
          Write-Output "probe=profile-comparison common_intersection=$($results.common_intersection_ubuntu)/$($results.common_intersection_windows) github_guide=$($results.github_guide_ubuntu)/$($results.github_guide_windows) actions_readme=$($results.actions_readme_ubuntu)/$($results.actions_readme_windows)"
          if ($results.Values -contains 'unverified' -or $results.Values -contains 'error') {
            Write-Output 'probe=profile-selection result=blocked reason=failed-or-ambiguous-arm'
            exit 1
          }
          if ($results.common_intersection_ubuntu -eq 'verified' -and $results.common_intersection_windows -eq 'verified') {
            Write-Output 'probe=profile-selection result=selected profile=common-intersection'
            exit 0
          }
          if ($results.github_guide_ubuntu -eq 'verified' -and $results.github_guide_windows -eq 'verified') {
            Write-Output 'probe=profile-selection result=selected profile=github-guide'
            exit 0
          }
          if ($results.actions_readme_ubuntu -eq 'verified' -and $results.actions_readme_windows -eq 'verified') {
            Write-Output 'probe=profile-selection result=selected profile=actions-readme'
            exit 0
          }
          Write-Output 'probe=profile-selection result=blocked reason=no-shared-verified-profile'
          exit 1
