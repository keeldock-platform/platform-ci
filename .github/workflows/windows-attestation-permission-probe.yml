  actions-readme-ubuntu:
    name: actions-readme-ubuntu-24.04
    needs: require-reviewed-main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      result: ${{ steps.classify.outputs.result }}
    defaults:
      run:
        shell: pwsh
    env:
      PROBE_PROFILE: actions-readme
      PROBE_RUNNER: ubuntu-24.04
      PROBE_PREDICATE_TYPE: https://example.invalid/attestation-permission-probe/v1
      PROBE_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/windows-attestation-permission-probe.yml
    steps:
      - name: Create passive synthetic subject
        id: subject
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $subjectDirectory = Join-Path $env:RUNNER_TEMP 'attestation-permission-probe'
          [System.IO.Directory]::CreateDirectory($subjectDirectory) | Out-Null
          $subjectPath = Join-Path $subjectDirectory 'probe.bin'
          $subjectBytes = [System.Text.Encoding]::ASCII.GetBytes("synthetic permission probe subject v1`n")
          [System.IO.File]::WriteAllBytes($subjectPath, $subjectBytes)

      - name: Attest synthetic subject
        id: attest
        if: steps.subject.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-permission-probe/probe.bin
          predicate-type: https://example.invalid/attestation-permission-probe/v1
          predicate: '{"probe":"source-free-permission-probe-v1"}'
          push-to-registry: false
          create-storage-record: false
          show-summary: false

      - name: Verify exact subject and signature
        id: verify
        if: steps.attest.outcome == 'success'
        continue-on-error: true
        env:
          PROBE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PROBE_REPOSITORY: ${{ github.repository }}
          PROBE_SUBJECT: ${{ runner.temp }}/attestation-permission-probe/probe.bin
        run: |
          $ErrorActionPreference = 'Stop'
          $failureReason = 'verification'
          try {
            if ($env:PROBE_PROFILE -notin @('common-intersection', 'github-guide', 'actions-readme')) { throw 'invalid' }
            if ($env:PROBE_RUNNER -notin @('ubuntu-24.04', 'windows-2025')) { throw 'invalid' }
            if ($env:PROBE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'invalid' }
            if ($env:PROBE_SIGNER_WORKFLOW -ne "$($env:PROBE_REPOSITORY)/.github/workflows/windows-attestation-permission-probe.yml") { throw 'invalid' }
            if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:PROBE_BUNDLE)) { throw 'invalid' }
            $imageOs = $env:ImageOS
            $imageVersion = $env:ImageVersion
            if ($imageOs -notmatch '^[A-Za-z0-9._-]{1,64}$' -or $imageVersion -notmatch '^[A-Za-z0-9._-]{1,64}$') { throw 'invalid' }

            $failureReason = 'subject'
            $subjectInfo = Get-Item -LiteralPath $env:PROBE_SUBJECT
            if ($subjectInfo.Length -gt 256) { throw 'invalid' }
            $subjectDigest = (Get-FileHash -LiteralPath $env:PROBE_SUBJECT -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($subjectDigest -ne 'cf46dd9088c858970cef86ae444af8cf0dec8d4fdcbc36af595220011689a0c8') { throw 'invalid' }

            $failureReason = 'bundle'
            $bundleInfo = Get-Item -LiteralPath $env:PROBE_BUNDLE
            if ($bundleInfo.Length -le 0 -or $bundleInfo.Length -gt 1048576) { throw 'invalid' }
            if ($null -eq (Get-Command gh -ErrorAction SilentlyContinue)) { throw 'invalid' }

            $failureReason = 'verifier'
            $ghVersionOutput = & gh version 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'invalid' }
            $ghVersionLine = $ghVersionOutput | Select-Object -First 1
            if ($ghVersionLine -notmatch '^gh version ([0-9]+\.[0-9]+\.[0-9]+)(\s|$)') { throw 'invalid' }
            $ghVersion = $Matches[1]

            $failureReason = 'signature-verification'
            & gh attestation verify $env:PROBE_SUBJECT `
              --bundle $env:PROBE_BUNDLE `
              --repo $env:PROBE_REPOSITORY `
              --signer-workflow $env:PROBE_SIGNER_WORKFLOW `
              --predicate-type $env:PROBE_PREDICATE_TYPE `
              --cert-oidc-issuer https://token.actions.githubusercontent.com `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) { throw 'unverified' }
          } catch {
            $verificationResult = if ($failureReason -eq 'signature-verification') { 'unverified' } else { 'error' }
            "result=$verificationResult" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Output "probe=verification-result profile=$env:PROBE_PROFILE runner=$env:PROBE_RUNNER result=$verificationResult reason=$failureReason"
            exit 1
          }
          "result=verified" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "probe=verification-result profile=$env:PROBE_PROFILE runner=$env:PROBE_RUNNER result=verified image=$imageOs image_version=$imageVersion verifier=gh-$ghVersion subject=sha256:$subjectDigest"

      - name: Classify probe outcome
        id: classify
        if: always()
        env:
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
        run: |
          $result = 'error'
          if ($env:SUBJECT_OUTCOME -eq 'success') {
            if ($env:ATTEST_OUTCOME -eq 'failure') {
              $result = 'unverified'
            } elseif ($env:ATTEST_OUTCOME -eq 'success' -and $env:VERIFY_RESULT -eq 'verified' -and $env:VERIFY_OUTCOME -eq 'success') {
              $result = 'verified'
            } elseif ($env:ATTEST_OUTCOME -eq 'success' -and $env:VERIFY_RESULT -eq 'unverified') {
              $result = 'unverified'
            }
          }
          "result=$result" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "probe=outcome profile=$env:PROBE_PROFILE runner=$env:PROBE_RUNNER result=$result"

