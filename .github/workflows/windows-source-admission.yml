name: windows-source-admission
run-name: Windows admission ${{ inputs.mode }} ${{ inputs.mode == 'source' && inputs.source_sha || 'synthetic' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the synthetic proof or the bound source candidate
        required: true
        type: choice
        options:
          - synthetic
          - source
        default: synthetic
      source_sha:
        description: Bound private source commit
        required: false
        type: string
      base_sha:
        description: Admitted source base commit
        required: false
        type: string
      base_branch:
        description: Admitted permanent source branch
        required: false
        type: choice
        options:
          - main
          - develop
          - uat
      fingerprint:
        description: Reviewed source diff fingerprint
        required: false
        type: string
      environment_name:
        description: Protected environment the source fetch job runs in
        required: false
        type: string
permissions: {}
cache-mode: none
jobs:
  settings:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && github.server_url == 'https://github.com' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: none
    permissions:
      actions: read
      contents: read
    outputs:
      expected: ${{ steps.identity.outputs.expected }}
      cache_digest: ${{ steps.identity.outputs.cache_digest }}
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_MODE: ${{ inputs.mode }}
      CACHE_MODE: none
      KD_SOURCE_PREFIX: WINDOWS_SOURCE
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
      REQUESTED_BASE_BRANCH: ${{ inputs.base_branch }}
      REQUESTED_FINGERPRINT: ${{ inputs.fingerprint }}
      REQUESTED_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      WINDOWS_SOURCE_ENVIRONMENT_NAME: ${{ vars.WINDOWS_SOURCE_ENVIRONMENT_NAME }}
      WINDOWS_SOURCE_ALLOWED_SHA: ${{ vars.WINDOWS_SOURCE_ALLOWED_SHA }}
      WINDOWS_SOURCE_ALLOWED_BASE_SHA: ${{ vars.WINDOWS_SOURCE_ALLOWED_BASE_SHA }}
      WINDOWS_SOURCE_ALLOWED_BASE_BRANCH: ${{ vars.WINDOWS_SOURCE_ALLOWED_BASE_BRANCH }}
      WINDOWS_SOURCE_ALLOWED_FINGERPRINT: ${{ vars.WINDOWS_SOURCE_ALLOWED_FINGERPRINT }}
      WINDOWS_SOURCE_ALLOWED_CONTROL_SHA: ${{ vars.WINDOWS_SOURCE_ALLOWED_CONTROL_SHA }}
      WINDOWS_SOURCE_ACCEPTED_NODE_LOCK_SHA256: ${{ vars.WINDOWS_SOURCE_ACCEPTED_NODE_LOCK_SHA256 }}
      WINDOWS_SOURCE_ACCEPTED_MANIFEST_SHA256: ${{ vars.WINDOWS_SOURCE_ACCEPTED_MANIFEST_SHA256 }}
      WINDOWS_SOURCE_ACCEPTED_NODE_PROVENANCE_JSON: ${{ vars.WINDOWS_SOURCE_ACCEPTED_NODE_PROVENANCE_JSON }}
    steps:
      - name: Fetch exact public control
        run: |
          set -euo pipefail
          [[ "$CI_REPOSITORY" == "keeldock-platform/platform-ci" && "$CI_SERVER_URL" == "https://github.com" ]]
          [[ "$CI_REF" == "refs/heads/main" || "$CI_REF" == "refs/heads/untrusted" ]]
          [[ "$CI_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$CI_REF" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          [[ "$(git rev-parse --verify HEAD 2>/dev/null)" == "$CI_SHA" ]]
      - name: Snapshot cache inventory and validate preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B kit/confinement/linux_source_build.py windows-snapshot
      - name: Build audit identity
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B kit/confinement/confinement_public_audit.py windows-expected
  windows-producer:
    name: role-call-windows-producer-v1
    needs:
      - settings
    if: ${{ needs.settings.result == 'success' && github.event_name == 'workflow_dispatch' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    uses: ./.github/workflows/lane-h-windows-receiver.yml
    with:
      profile: candidate
      role: producer
      mode: ${{ inputs.mode }}
      source_sha: ${{ inputs.source_sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    secrets:
      KD_WINDOWS_LOG_CANARY: ${{ secrets.KD_WINDOWS_LOG_CANARY }}
  windows-verifier:
    name: role-call-windows-verifier-v1
    needs:
      - settings
    if: ${{ needs.settings.result == 'success' && github.event_name == 'workflow_dispatch' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    uses: ./.github/workflows/lane-h-windows-receiver.yml
    with:
      profile: candidate
      role: verifier
      mode: ${{ inputs.mode }}
      source_sha: ${{ inputs.source_sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    secrets:
      KD_WINDOWS_LOG_CANARY: ${{ secrets.KD_WINDOWS_LOG_CANARY }}
  linux-fetch-encrypt:
    name: role-call-linux-fetch-encrypt-v1
    needs:
      - settings
    if: ${{ needs.settings.result == 'success' && github.event_name == 'workflow_dispatch' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    uses: ./.github/workflows/lane-h-linux-fetch-encrypt.yml
    with:
      profile: candidate
      mode: ${{ inputs.mode }}
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      base_branch: ${{ inputs.base_branch }}
      fingerprint: ${{ inputs.fingerprint }}
      environment_name: ${{ inputs.environment_name }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
      SOURCE_REPOSITORY_OWNER: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
      SOURCE_REPOSITORY_NAME: ${{ secrets.SOURCE_REPOSITORY_NAME }}
  capsule-attester:
    name: role-call-capsule-attester-v1
    needs:
      - settings
      - linux-fetch-encrypt
    if: ${{ needs.settings.result == 'success' && needs.linux-fetch-encrypt.result == 'success' && github.event_name == 'workflow_dispatch' && ((inputs.mode == 'synthetic' && github.ref == 'refs/heads/main') || (inputs.mode == 'source' && github.ref == 'refs/heads/untrusted')) }}
    uses: ./.github/workflows/lane-h-capsule-attester.yml
    with:
      profile: candidate
      mode: ${{ inputs.mode }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
  verify-role-evidence:
    name: verify-role-evidence-windows-source
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.repository == 'keeldock-platform/platform-ci' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs:
      - settings
      - windows-producer
      - windows-verifier
      - linux-fetch-encrypt
      - capsule-attester
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      KD_PROFILE: candidate
      KD_REPOSITORY: ${{ github.repository }}
      KD_SHA: ${{ github.sha }}
      KD_REF: ${{ github.ref }}
      KD_RUN_ID: ${{ github.run_id }}
      KD_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout reviewed control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect complete attempt-specific job and artifact evidence
        run: |
          set -euo pipefail
          [[ "$KD_REPOSITORY" == "keeldock-platform/platform-ci" && ( "$KD_REF" == "refs/heads/main" || "$KD_REF" == "refs/heads/untrusted" ) && "$KD_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/role-signer-evidence/artifacts"
          evidence="$RUNNER_TEMP/role-signer-evidence"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/repository.json" -- gh api "repos/$KD_REPOSITORY" --jq '{id:.id,full_name:.full_name,owner_id:.owner.id,visibility:.visibility}'
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/run.json" -- gh api "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/jobs-pages.json" -- gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/attempts/$KD_RUN_ATTEMPT/jobs?per_page=100"
          python -B kit/confinement/role_signer.py guard --label api-fetch-failed --output "$evidence/artifact-pages.json" -- gh api --paginate --slurp "repos/$KD_REPOSITORY/actions/runs/$KD_RUN_ID/artifacts?per_page=100"
          python -B kit/confinement/role_signer.py wrap-pages --kind jobs --input "$evidence/jobs-pages.json" --output "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py wrap-pages --kind artifacts --input "$evidence/artifact-pages.json" --output "$evidence/artifacts.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          for role in windows-producer windows-verifier linux-fetch-encrypt capsule-attester; do
            case "$role" in
              windows-*) signer='lane-h-windows-receiver.yml' ;;
              *) signer="lane-h-$role.yml" ;;
            esac
            code=0
            artifact_name="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifacts.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field name)" || code=$?
            if [[ "$code" -ne 0 ]]; then printf '%s\n' "${artifact_name:0:200}"; printf 'probe=role-signer result=unavailable reason=find-artifact-failed exit=%s role=%s\n' "$code" "$role"; exit 1; fi
            code=0
            artifact_id="$(python -B kit/confinement/role_signer.py find-artifact --artifacts-file "$evidence/artifacts.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --field id)" || code=$?
            if [[ "$code" -ne 0 ]]; then printf '%s\n' "${artifact_id:0:200}"; printf 'probe=role-signer result=unavailable reason=find-artifact-failed exit=%s role=%s\n' "$code" "$role"; exit 1; fi
            directory="$evidence/artifacts/$artifact_name"
            python -B kit/confinement/role_signer.py guard --label artifact-download-failed --output "$directory.zip" -- gh api "repos/$KD_REPOSITORY/actions/artifacts/$artifact_id/zip"
            python -B kit/confinement/role_signer.py extract-artifact --artifacts-file "$evidence/artifacts.json" --role "$role" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --archive-file "$directory.zip" --output-directory "$directory"
            python -B kit/confinement/role_signer.py guard --label attestation-verify-failed --output "$directory/verified.json" -- gh attestation verify "$directory/subject.bin" --bundle "$directory/bundle.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/$signer" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json
            subject_sha=$(sha256sum "$directory/subject.bin" | awk '{print $1}')
            printf '%s\n' "$subject_sha" > "$directory/subject.sha256"
            if [[ ! -f "$evidence/provider-$subject_sha.json" ]]; then
              provider_path="repos/$KD_REPOSITORY/attestations/sha256:$subject_sha"
              python -B kit/confinement/role_signer.py guard --label provider-fetch-failed --output "$evidence/provider-$subject_sha-http.txt" -- gh api --include --paginate "$provider_path?per_page=100"
              python -B kit/confinement/role_signer.py wrap-provider-http --input "$evidence/provider-$subject_sha-http.txt" --subject-digest "$subject_sha" --output "$evidence/provider-$subject_sha.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
              python -B kit/confinement/role_signer.py export-provider --snapshot "$evidence/provider-$subject_sha.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA" --output-directory "$evidence/provider-$subject_sha"
              while read -r index provider_role; do
                case "$provider_role" in
                  windows-*) provider_signer='lane-h-windows-receiver.yml' ;;
                  *) provider_signer="lane-h-$provider_role.yml" ;;
                esac
                python -B kit/confinement/role_signer.py guard --label attestation-verify-failed --output "$evidence/provider-$subject_sha/verified-$index.json" -- gh attestation verify "$directory/subject.bin" --bundle "$evidence/provider-$subject_sha/bundle-$index.json" --repo "$KD_REPOSITORY" --signer-workflow "$KD_REPOSITORY/.github/workflows/$provider_signer" --predicate-type 'https://example.invalid/role-statement/v1' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --format json
              done < "$evidence/provider-$subject_sha/manifest.txt"
            fi
            sha256sum "$directory/subject.bin" "$directory/predicate.json" "$directory/bundle.json" "$directory/verified.json" >> "$evidence/file-hashes.txt"
          done
          sha256sum .github/workflows/windows-source-admission.yml .github/workflows/lane-h-windows-receiver.yml .github/workflows/lane-h-linux-fetch-encrypt.yml .github/workflows/lane-h-capsule-attester.yml > "$evidence/workflow-hashes.txt"
          code=0
          linux_job_id="$(python -B kit/confinement/role_signer.py find-job --observe --profile "$KD_PROFILE" --role linux-fetch-encrypt --jobs-file "$evidence/jobs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA")" || code=$?
          if [[ "$code" -ne 0 ]]; then printf '%s\n' "${linux_job_id:0:200}"; printf 'probe=role-signer result=unavailable reason=find-job-failed exit=%s\n' "$code"; exit 1; fi
          python -B kit/confinement/role_signer.py guard --label run-view-failed --attempts 5 --pause 6 --output "$evidence/linux.log" --fallback-route "repos/$KD_REPOSITORY/actions/jobs/$linux_job_id/logs" -- gh run view "$KD_RUN_ID" --repo "$KD_REPOSITORY" --job "$linux_job_id" --log
          python -B kit/confinement/role_signer.py parse-linux-logs --observe --profile "$KD_PROFILE" --jobs-file "$evidence/jobs.json" --input "$evidence/linux.log" --output "$evidence/linux-logs.json" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --head-sha "$KD_SHA"
          python -B kit/confinement/role_signer.py verify-snapshot --observe --observation-output "$evidence/observed-mappings.json" --profile "$KD_PROFILE" --repository "$KD_REPOSITORY" --ref "$KD_REF" --control-sha "$KD_SHA" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --root . --jobs-file "$evidence/jobs.json" --artifacts-file "$evidence/artifacts.json" --repository-metadata "$evidence/repository.json" --run-metadata "$evidence/run.json" --evidence-directory "$evidence" --linux-logs "$evidence/linux-logs.json"
      - name: Retain source-free role evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: role-signer-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/role-signer-evidence
          if-no-files-found: warn
          retention-days: 1
      - name: Apply the exact candidate profile and uniqueness policy
        run: |
          set -euo pipefail
          python -B kit/confinement/role_signer.py verify-snapshot --profile "$KD_PROFILE" --repository "$KD_REPOSITORY" --ref "$KD_REF" --control-sha "$KD_SHA" --run-id "$KD_RUN_ID" --run-attempt "$KD_RUN_ATTEMPT" --root . --jobs-file "$RUNNER_TEMP/role-signer-evidence/jobs.json" --artifacts-file "$RUNNER_TEMP/role-signer-evidence/artifacts.json" --repository-metadata "$RUNNER_TEMP/role-signer-evidence/repository.json" --run-metadata "$RUNNER_TEMP/role-signer-evidence/run.json" --evidence-directory "$RUNNER_TEMP/role-signer-evidence" --linux-logs "$RUNNER_TEMP/role-signer-evidence/linux-logs.json"
  audit:
    needs:
      - settings
      - windows-producer
      - windows-verifier
      - linux-fetch-encrypt
      - capsule-attester
      - verify-role-evidence
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.mode == 'source' && 'windows-source-exec' || '' }}
    timeout-minutes: 15
    cache-mode: none
    permissions:
      actions: read
      checks: read
    defaults:
      run:
        shell: bash
    env:
      CI_MODE: ${{ inputs.mode }}
      CONFINEMENT_AUDIT_EXPECTED: ${{ needs.settings.outputs.expected }}
    steps:
      - name: Fetch exact public control
        run: |
          set -euo pipefail
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$GITHUB_REF" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          [[ "$(git rev-parse --verify HEAD 2>/dev/null)" == "$GITHUB_SHA" ]]
      - name: Audit logs, artifacts, cache metadata and verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KD_WINDOWS_LOG_CANARY: ${{ inputs.mode == 'synthetic' && '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' || secrets.KD_WINDOWS_LOG_CANARY }}
        run: python3 -B kit/confinement/confinement_public_audit.py windows
