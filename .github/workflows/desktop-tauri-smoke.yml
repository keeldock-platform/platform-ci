name: desktop-tauri-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions: {}
concurrency:
  group: desktop-tauri-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop-smoke:
    name: desktop-smoke-${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15' && 120 || 90 }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the public fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
          check-latest: false
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          printf 'RUSTUP_TOOLCHAIN=1.99.1\n' >> "$GITHUB_ENV"
      - name: Install Linux native build prerequisites
        if: ${{ matrix.runner == 'ubuntu-24.04' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install --no-install-recommends --yes \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - name: Record macOS toolchain versions
        if: ${{ matrix.runner == 'macos-15' }}
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --find clang
          clang --version | sed -n '1p'
          rustc --version
          cargo --version
          node --version
          npm --version
      - name: Build the fixture on macOS and Linux
        if: ${{ matrix.runner != 'windows-2025' }}
        working-directory: kit/devlane/fixtures/desktop-tauri-smoke
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            rustc --version
            cargo --version
            node --version
            npm --version
          fi
          npm ci --ignore-scripts
          npm run build
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          npm run tauri build -- --debug --no-bundle
      - name: Record Windows toolchain versions and build the fixture
        if: ${{ matrix.runner == 'windows-2025' }}
        shell: pwsh
        working-directory: kit/devlane/fixtures/desktop-tauri-smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC installation was not found' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $environmentLines = & $env:ComSpec /d /s /c ('call "' + $vcvars + '" >nul && set')
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          foreach ($line in $environmentLines) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) {
              $name = $line.Substring(0, $separator)
              $value = $line.Substring($separator + 1)
              [Environment]::SetEnvironmentVariable($name, $value, 'Process')
            }
          }
          $compiler = Join-Path $vsPath 'VC\Tools\MSVC'
          $compilerVersion = (Get-ChildItem $compiler -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Output "msvc-version=$compilerVersion"
          cl.exe /Bv
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersions = (Get-ChildItem $sdkRoot -Directory | Select-Object -ExpandProperty Name) -join ','
          Write-Output "windows-sdk=$sdkVersions"
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          if (Test-Path $webViewRoot) {
            $webViewVersions = (Get-ChildItem $webViewRoot -Directory | Select-Object -ExpandProperty Name) -join ','
            Write-Output "webview2-runtime=$webViewVersions"
          } else {
            Write-Output 'webview2-runtime=not-found'
          }
          rustc --version
          cargo --version
          node --version
          npm.cmd --version
          npm.cmd ci --ignore-scripts
          npm.cmd run build
          cargo.exe build --locked --manifest-path src-tauri/Cargo.toml
          cargo.exe test --locked --manifest-path src-tauri/Cargo.toml
          npm.cmd run tauri build -- --debug --no-bundle
