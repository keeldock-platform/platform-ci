            exit 1
          fi
          IFS= read -r publish_line < "$publish_file"
          [[ "$publish_line" == KD-FEEDBACK-PUBLISHER\ * ]] || exit 1
          IFS= read -r producer_line < "$stdout_file" || exit 1
          rm -rf "$capture_dir"
          trap - EXIT
          printf 'token_revocation=confirmed\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' "$producer_line"
      - name: Upload the single encrypted member
        id: uploader
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feedback-cargo_lock-${{ inputs.request_id }}
          path: ${{ runner.temp }}/core-feedback-upload/rust-lock-return-v1.enc
          archive: true
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error
      - name: Record uploader evidence
        env:
          ARTIFACT_ID: ${{ steps.uploader.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.uploader.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" && "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,18}$ ]] || exit 1
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]] || exit 1
          printf 'KD-FEEDBACK-UPLOAD schema=1 request-id=%s artifact-id=%s archive-digest=%s\n' \
            "$KD_FEEDBACK_REQUEST_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
      - name: Write producer summary
        if: ${{ success() && steps.producer.outputs.token_revocation == 'confirmed' }}
        run: |
          set -euo pipefail
          line="KD-FEEDBACK-PRODUCER-SUMMARY schema=1 request-id=$KD_FEEDBACK_REQUEST_ID profile=cargo_lock status=encrypted"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$line"
      - name: Revoke token when producer did not confirm
        if: ${{ always() && steps.source-token.outputs.token != '' && steps.producer.outputs.token_revocation != 'confirmed' }}
        env:
          SOURCE_READER_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          PRODUCER_REVOCATION: ${{ steps.producer.outputs.producer_revocation }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_READER_TOKEN" ]] || exit 1
          revoke_status=0
          record="$(printf '%s' "$SOURCE_READER_TOKEN" | sudo -n -- /usr/bin/env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C SOURCE_REPOSITORY_ID="$SOURCE_REPOSITORY_ID" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_core_bootstrap.py --phase revoke --token-stdin 2>/dev/null)" || revoke_status=$?
          if [[ "$revoke_status" -eq 0 && "$record" == '{"metadata":"verified","reason":"ok","repository_scope":"verified","revocation":"confirmed","schema_version":1,"status":"passed"}' ]]; then
            :
          elif [[ "$PRODUCER_REVOCATION" == "confirmed" && "$record" == '{"metadata":"unverified","reason":"repository_list_unavailable","repository_scope":"unverified","revocation":"unconfirmed","schema_version":1,"status":"refused"}' ]]; then
            printf 'KD-REVOKE-NOTE token=already-revoked-by-producer\n'
          else
            exit 1
          fi
          printf 'KD-FEEDBACK-CLEANUP schema=1 control-sha=%s run-id=%s run-attempt=1 token-revocation=confirmed\n' "$CI_SHA" "$GITHUB_RUN_ID"
      - name: Remove staged ciphertext
        if: ${{ always() }}
        run: |
          set -euo pipefail
          staged="${RUNNER_TEMP%/}/core-feedback-upload/rust-lock-return-v1.enc"
          if [[ -e "$staged" || -L "$staged" ]]; then rm -f -- "$staged"; fi
          staged_dir="${RUNNER_TEMP%/}/core-feedback-upload"
          if [[ -d "$staged_dir" && ! -L "$staged_dir" ]]; then rmdir -- "$staged_dir"; fi
  core-rust-lock-return-audit:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - core-rust-lock-return-settings
      - core-rust-lock-return-prepare
      - core-rust-lock-return
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    cache-mode: none
    permissions:
      actions: read
      checks: read
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      KD_FEEDBACK_REQUEST_ID: ${{ inputs.request_id }}
      KD_FEEDBACK_REQUEST_B64: ${{ inputs.request_b64 }}
      KD_FEEDBACK_RECIPIENT_SPKI_B64: ${{ inputs.recipient_spki_b64 }}
      MACOS_CACHE_SNAPSHOT: ${{ needs.core-rust-lock-return-settings.outputs.cache_snapshot }}
    steps:
      - name: Fetch exact public control
        run: |
          set -euo pipefail
          [[ "$CI_EVENT_NAME" == "workflow_dispatch" && "$CI_REF" == "refs/heads/main" ]]
          [[ "$CI_REPOSITORY" == "keeldock-platform/platform-ci" && "$CI_SERVER_URL" == "https://github.com" ]]
          [[ "$CI_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$CI_REF" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          [[ "$(git rev-parse --verify HEAD 2>/dev/null)" == "$CI_SHA" ]]
      - name: Audit completed producer and public surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          audit_line="$(python3 -B kit/confinement/feedback_public_audit.py audit 2>/dev/null)"
          audit_status=$?
          set -e
          if [[ "$audit_status" -ne 0 || "$(printf '%s\n' "$audit_line" | wc -l)" -ne 1 \
            || "$(printf '%s' "$audit_line" | wc -c)" -gt 16384 \
            || "$audit_line" != KD-FEEDBACK-AUDIT\ * ]]; then
            set +e
            safe_refusal="$(printf '%s\n' "$audit_line" | python3 -B kit/confinement/feedback_public_audit.py normalize-refusal 2>/dev/null)"
            normalize_status=$?
            set -e
            if [[ "$normalize_status" -ne 0 || "$(printf '%s\n' "$safe_refusal" | wc -l)" -ne 1 \
              || "$(printf '%s' "$safe_refusal" | wc -c)" -gt 256 \
              || "$safe_refusal" != KD-FEEDBACK-AUDIT-REFUSAL\ * ]]; then
              safe_refusal='KD-FEEDBACK-AUDIT-REFUSAL {"phase":"unavailable","reason":"feedback_audit_invalid","schema_version":1}'
            fi
            printf '%s\n' "$safe_refusal"
            exit 1
          fi
          printf '%s\n' "$audit_line"
          printf '%s\n' "$audit_line" >> "$GITHUB_STEP_SUMMARY"
          summary="KD-FEEDBACK-AUDIT-SUMMARY schema=1 request-id=$KD_FEEDBACK_REQUEST_ID profile=cargo_lock status=passed"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$summary"
