            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_ENV="$GITHUB_ENV" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_PATH="$GITHUB_PATH" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" CI_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" RUNNER_HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            REQUESTED_SOURCE_SHA="$REQUESTED_SOURCE_SHA" REQUESTED_BASE_SHA="$REQUESTED_BASE_SHA" \
            REQUESTED_BASE_BRANCH="$REQUESTED_BASE_BRANCH" KD_NODE_EXECUTABLE="$node_path" \
            RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" KD_FEEDBACK_REQUEST_B64="$KD_FEEDBACK_REQUEST_B64" \
            KD_FEEDBACK_RECIPIENT_SPKI_B64="$KD_FEEDBACK_RECIPIENT_SPKI_B64" \
            CORE_CONTRACT_ALLOWED_SHA="$CORE_CONTRACT_ALLOWED_SHA" \
