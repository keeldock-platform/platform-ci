name: core-rust-lock-return
run-name: feedback-request-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Canonical one-use feedback request identifier
        required: true
        type: string
      request_b64:
        description: Canonical public feedback request record
        required: true
        type: string
      recipient_spki_b64:
        description: Public recipient key in canonical base64
        required: true
        type: string
permissions: {}
cache-mode: none
jobs:
  core-rust-lock-return-settings:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: none
    permissions:
      actions: read
    outputs:
      cache_snapshot: ${{ steps.settings.outputs.cache_snapshot }}
      request_id: ${{ steps.settings.outputs.request_id }}
      source_sha: ${{ steps.settings.outputs.source_sha }}
      base_sha: ${{ steps.settings.outputs.base_sha }}
      base_branch: ${{ steps.settings.outputs.base_branch }}
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      KD_FEEDBACK_REQUEST_ID: ${{ inputs.request_id }}
      KD_FEEDBACK_REQUEST_B64: ${{ inputs.request_b64 }}
      KD_FEEDBACK_RECIPIENT_SPKI_B64: ${{ inputs.recipient_spki_b64 }}
    steps:
      - name: Fetch exact public control
        run: |
          set -euo pipefail
          [[ "$CI_EVENT_NAME" == "workflow_dispatch" && "$CI_REF" == "refs/heads/main" ]]
          [[ "$CI_REPOSITORY" == "keeldock-platform/platform-ci" && "$CI_SERVER_URL" == "https://github.com" ]]
          [[ "$CI_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$CI_REF" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          [[ "$(git rev-parse --verify HEAD 2>/dev/null)" == "$CI_SHA" ]]
      - name: Validate public request and cache snapshot
        id: settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B kit/confinement/feedback_public_audit.py settings > "$RUNNER_TEMP/feedback-settings-record" 2> "$RUNNER_TEMP/feedback-settings-error"
          [[ "$(wc -l < "$RUNNER_TEMP/feedback-settings-record")" -eq 1 ]]
          [[ "$(wc -c < "$RUNNER_TEMP/feedback-settings-record")" -le 1024 ]]
          IFS= read -r marker < "$RUNNER_TEMP/feedback-settings-record"
          [[ "$marker" == KD-FEEDBACK-CACHE-SNAPSHOT\ schema=1\ control-sha=*\ run-id=*\ run-attempt=1\ digest=* ]]
          printf '%s\n' "$marker"
          summary="KD-FEEDBACK-SETTINGS schema=1 request-id=$KD_FEEDBACK_REQUEST_ID profile=cargo_lock status=verified"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$summary"
  core-rust-lock-return-prepare:
    needs: core-rust-lock-return-settings
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.core-rust-lock-return-settings.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 25
    cache-mode: none
    permissions: {}
    outputs:
      rust_smoke_digest: ${{ steps.prepare.outputs.rust_smoke_digest }}
      image_os: ${{ steps.prepare.outputs.image_os }}
      image_version: ${{ steps.prepare.outputs.image_version }}
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      KD_FEEDBACK_REQUEST_ID: ${{ inputs.request_id }}
      KD_FEEDBACK_REQUEST_B64: ${{ inputs.request_b64 }}
      KD_FEEDBACK_RECIPIENT_SPKI_B64: ${{ inputs.recipient_spki_b64 }}
    steps:
      - name: Fetch exact public control
        run: |
          set -euo pipefail
          [[ "$CI_EVENT_NAME" == "workflow_dispatch" && "$CI_REF" == "refs/heads/main" ]] || exit 1
          [[ "$CI_REPOSITORY" == "keeldock-platform/platform-ci" && "$CI_SERVER_URL" == "https://github.com" ]] || exit 1
          [[ "$CI_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$CI_REF" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          [[ "$(git rev-parse --verify HEAD 2>/dev/null)" == "$CI_SHA" ]] || exit 1
      - name: Set up fixed Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          check-latest: false
          package-manager-cache: false
      - name: Run source-free helper suites
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v24.22.1" ]] || exit 1
          [[ "$(npm --version)" == "11.19.1" ]] || exit 1
          node --test kit/confinement/test_node_lock_envelope.mjs kit/confinement/test_node_lock_manifest.mjs kit/confinement/test_feedback_smoke.mjs kit/confinement/test_development_feedback.mjs kit/confinement/test_feedback_producer_crypto.mjs kit/confinement/test_feedback_admin_crypto.mjs kit/confinement/test_node_contract_validation.mjs
          python3 -B kit/bootstrap/test_policy.py
          python3 -B kit/bootstrap/test_public_tree.py
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_macos*.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_feedback*.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_foundation_node_feedback.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_node_lock_receipt.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_cargo_lock_receipt.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_confinement_cargo_lock_bootstrap.py"
      - name: Record source-free preparation and Rust toolchain proof
        id: prepare
        run: |
          set -euo pipefail
          [[ "${ImageOS:-}" =~ ^[A-Za-z0-9._-]{1,64}$ && "${ImageVersion:-}" =~ ^[A-Za-z0-9._-]{1,64}$ && -n "${RUNNER_TEMP:-}" ]] || exit 1
          case "${ImageVersion:-}" in 20260907.0337.1|20261028.0489.1) ;; *) exit 1 ;; esac
          capture_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP%/}/feedback-rust-smoke.XXXXXX" 2>/dev/null)"
          trap '/bin/rm -rf "$capture_dir" 2>/dev/null' EXIT
          raw_file="$capture_dir/raw"
          validated_file="$capture_dir/validated"
          stderr_file="$capture_dir/stderr"
          validator_stderr="$capture_dir/validator-stderr"
          python3 -B kit/confinement/feedback_public_audit.py prepare >"$capture_dir/prepare" 2>"$capture_dir/prepare-stderr"
          [[ "$(/usr/bin/wc -l < "$capture_dir/prepare")" -eq 1 && "$(/usr/bin/wc -c < "$capture_dir/prepare")" -le 1024 ]] || exit 1
          IFS= read -r prepare_line < "$capture_dir/prepare"
          [[ "$prepare_line" == KD-FEEDBACK-PREPARE\ schema=1\ request-id=*\ profile=cargo_lock\ status=passed ]] || exit 1
          set +e
          sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            CI_SHA="$CI_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_TEMP="$RUNNER_TEMP" RUNNER_HOME="$HOME" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_rust_toolchain.py --control-sha "$CI_SHA" >"$raw_file" 2>"$stderr_file"
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 0 ]]; then printf 'KD-RUST-REFUSAL reason=smoke_failed\n'; exit 1; fi
          set +e
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            CI_SHA="$CI_SHA" GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$CI_REPOSITORY" \
            GITHUB_EVENT_NAME="$CI_EVENT_NAME" GITHUB_REF="$CI_REF" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_public_audit.py rust-toolchain-publish \
            <"$raw_file" >"$validated_file" 2>"$validator_stderr"
          validator_status=$?
          set -e
          if [[ "$validator_status" -ne 0 || "$(/usr/bin/wc -l < "$validated_file")" -ne 1 \
            || "$(/usr/bin/wc -c < "$validated_file")" -gt 16384 ]]; then
            printf 'KD-RUST-REFUSAL reason=capture_invalid\n'
            exit 1
          fi
          IFS= read -r rust_line < "$validated_file"
          [[ "$rust_line" == KD-RUST-SMOKE\ * ]] || exit 1
          digest_line="$(/usr/bin/shasum -a 256 "$validated_file")"
          rust_smoke_digest="${digest_line%% *}"
          [[ "$rust_smoke_digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
          /bin/rm -rf "$capture_dir"
          trap - EXIT
          printf 'rust_smoke_digest=%s\nimage_os=%s\nimage_version=%s\n' \
            "$rust_smoke_digest" "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$prepare_line" "$rust_line" | /usr/bin/tee -a "$GITHUB_STEP_SUMMARY"
  core-rust-lock-return:
    needs:
      - core-rust-lock-return-settings
      - core-rust-lock-return-prepare
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.core-rust-lock-return-settings.result == 'success' && needs.core-rust-lock-return-prepare.result == 'success' }}
    runs-on: macos-15
    environment: source-read
    timeout-minutes: 75
    cache-mode: none
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_SHA: ${{ github.sha }}
      CI_SERVER_URL: ${{ github.server_url }}
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_WORKSPACE: ${{ github.workspace }}
      REQUESTED_SOURCE_SHA: ${{ needs.core-rust-lock-return-settings.outputs.source_sha }}
      REQUESTED_BASE_SHA: ${{ needs.core-rust-lock-return-settings.outputs.base_sha }}
      REQUESTED_BASE_BRANCH: ${{ needs.core-rust-lock-return-settings.outputs.base_branch }}
      KD_FEEDBACK_REQUEST_ID: ${{ inputs.request_id }}
      KD_FEEDBACK_REQUEST_B64: ${{ inputs.request_b64 }}
      KD_FEEDBACK_RECIPIENT_SPKI_B64: ${{ inputs.recipient_spki_b64 }}
      EXPECTED_PREPARE_RUST_SMOKE_DIGEST: ${{ needs.core-rust-lock-return-prepare.outputs.rust_smoke_digest }}
      EXPECTED_PREPARE_IMAGE_OS: ${{ needs.core-rust-lock-return-prepare.outputs.image_os }}
      EXPECTED_PREPARE_IMAGE_VERSION: ${{ needs.core-rust-lock-return-prepare.outputs.image_version }}
    steps:
      - name: Fetch exact public control
        run: |
          set -euo pipefail
          [[ "$CI_EVENT_NAME" == "workflow_dispatch" && "$CI_REF" == "refs/heads/main" ]] || exit 1
          [[ "$CI_REPOSITORY" == "keeldock-platform/platform-ci" && "$CI_SERVER_URL" == "https://github.com" ]] || exit 1
          [[ "$CI_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git init -q . 2>/dev/null
          git config core.autocrlf false 2>/dev/null
          git remote add origin "${CI_SERVER_URL%/}/${CI_REPOSITORY}.git" 2>/dev/null
          git fetch --quiet --no-tags --depth=1 origin "$CI_REF" 2>/dev/null
          git checkout --quiet --detach FETCH_HEAD 2>/dev/null
          [[ "$(git rev-parse --verify HEAD 2>/dev/null)" == "$CI_SHA" ]] || exit 1
      - name: Set up fixed Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          check-latest: false
          package-manager-cache: false
      - name: Repeat source-free suites and prepare Rust smoke evidence
        run: |
          set -euo pipefail
          [[ "$ImageOS" =~ ^[A-Za-z0-9._-]{1,64}$ && "$ImageVersion" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || exit 1
          [[ "$ImageOS" == "$EXPECTED_PREPARE_IMAGE_OS" ]] || exit 1
          printf 'KD-IMAGE-PAIR prepare=%s main=%s\n' "$EXPECTED_PREPARE_IMAGE_VERSION" "$ImageVersion"
          case "$EXPECTED_PREPARE_IMAGE_VERSION" in 20260907.0337.1|20261028.0489.1) ;; *) exit 1 ;; esac
          case "$ImageVersion" in 20260907.0337.1|20261028.0489.1) ;; *) exit 1 ;; esac
          [[ "$EXPECTED_PREPARE_RUST_SMOKE_DIGEST" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$(node --version)" == "v24.22.1" ]] || exit 1
          [[ "$(npm --version)" == "11.19.1" ]] || exit 1
          node --test kit/confinement/test_node_lock_envelope.mjs kit/confinement/test_node_lock_manifest.mjs kit/confinement/test_feedback_smoke.mjs kit/confinement/test_development_feedback.mjs kit/confinement/test_feedback_producer_crypto.mjs kit/confinement/test_feedback_admin_crypto.mjs kit/confinement/test_node_contract_validation.mjs
          python3 -B kit/bootstrap/test_policy.py
          python3 -B kit/bootstrap/test_public_tree.py
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_macos*.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_feedback*.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_foundation_node_feedback.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_node_lock_receipt.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_cargo_lock_receipt.py"
          /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 -I -S -B -m unittest discover -s kit/confinement -p "test_confinement_cargo_lock_bootstrap.py"
          [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]] || exit 1
          capture_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP%/}/feedback-rust-smoke.XXXXXX" 2>/dev/null)"
          trap '/bin/rm -rf "$capture_dir" 2>/dev/null' EXIT
          raw_file="$capture_dir/raw"
          validated_file="$capture_dir/validated"
          set +e
          sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            CI_SHA="$CI_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_TEMP="$RUNNER_TEMP" RUNNER_HOME="$HOME" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_rust_toolchain.py --control-sha "$CI_SHA" >"$raw_file" 2>"$capture_dir/stderr"
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 0 ]]; then printf 'KD-RUST-REFUSAL reason=smoke_failed\n'; exit 1; fi
          set +e
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            CI_SHA="$CI_SHA" GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$CI_REPOSITORY" \
            GITHUB_EVENT_NAME="$CI_EVENT_NAME" GITHUB_REF="$CI_REF" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_public_audit.py rust-toolchain-publish \
            <"$raw_file" >"$validated_file" 2>"$capture_dir/validator-stderr"
          validator_status=$?
          set -e
          if [[ "$validator_status" -ne 0 || "$(/usr/bin/wc -l < "$validated_file")" -ne 1 \
            || "$(/usr/bin/wc -c < "$validated_file")" -gt 16384 ]]; then
            printf 'KD-RUST-REFUSAL reason=capture_invalid\n'
            exit 1
          fi
          rust_digest_line="$(/usr/bin/shasum -a 256 "$validated_file")"
          rust_smoke_digest="${rust_digest_line%% *}"
          [[ "$rust_smoke_digest" == "$EXPECTED_PREPARE_RUST_SMOKE_DIGEST" ]] || exit 1
          /bin/rm -rf "$capture_dir"
          trap - EXIT
      - name: Verify protected bindings and reader scope
        env:
          CORE_CONTRACT_ALLOWED_SHA: ${{ vars.CORE_CONTRACT_ALLOWED_SHA }}
          CORE_CONTRACT_ALLOWED_CONTROL_SHA: ${{ vars.CORE_CONTRACT_ALLOWED_CONTROL_SHA }}
          CORE_CONTRACT_REVIEWED_SOURCE_SHA: ${{ vars.CORE_CONTRACT_REVIEWED_SOURCE_SHA }}
          CORE_CONTRACT_REVIEWED_BASE_SHA: ${{ vars.CORE_CONTRACT_REVIEWED_BASE_SHA }}
          CORE_CONTRACT_REVIEWED_BASE_BRANCH: ${{ vars.CORE_CONTRACT_REVIEWED_BASE_BRANCH }}
          CORE_CONTRACT_REVIEWED_CANDIDATE_REF: ${{ secrets.CORE_CONTRACT_REVIEWED_CANDIDATE_REF }}
          CORE_CONTRACT_REVIEWED_DIFF_SHA256: ${{ vars.CORE_CONTRACT_REVIEWED_DIFF_SHA256 }}
          SOURCE_READER_CLIENT_ID: ${{ vars.SOURCE_READER_CLIENT_ID }}
          SOURCE_READER_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_REPOSITORY_OWNER: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          SOURCE_REPOSITORY_NAME: ${{ secrets.SOURCE_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          capture_dir="$(mktemp -d "${RUNNER_TEMP%/}/feedback-binding.XXXXXX")"
          trap 'rm -rf "$capture_dir"' EXIT
          python3 -B kit/confinement/feedback_public_audit.py preflight >"$capture_dir/result" 2>/dev/null
          [[ "$(wc -l < "$capture_dir/result")" -eq 1 && "$(wc -c < "$capture_dir/result")" -le 1024 ]] || exit 1
          IFS= read -r binding_line < "$capture_dir/result"
          [[ "$binding_line" == "KD-FEEDBACK-BINDING schema=1 request-id=$KD_FEEDBACK_REQUEST_ID profile=cargo_lock status=verified" ]] || exit 1
          rm -rf "$capture_dir"
          trap - EXIT
          [[ "$CORE_CONTRACT_ALLOWED_SHA" == "$REQUESTED_SOURCE_SHA" && "$CORE_CONTRACT_ALLOWED_CONTROL_SHA" == "$CI_SHA" ]] || exit 1
          [[ "$CORE_CONTRACT_REVIEWED_SOURCE_SHA" == "$REQUESTED_SOURCE_SHA" && "$CORE_CONTRACT_REVIEWED_BASE_SHA" == "$REQUESTED_BASE_SHA" ]] || exit 1
          [[ "$CORE_CONTRACT_REVIEWED_BASE_BRANCH" == "$REQUESTED_BASE_BRANCH" && "$CORE_CONTRACT_REVIEWED_DIFF_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$CORE_CONTRACT_REVIEWED_CANDIDATE_REF" == refs/heads/* && "$SOURCE_REPOSITORY_ID" =~ ^[1-9][0-9]{0,18}$ ]] || exit 1
          [[ "$SOURCE_READER_CLIENT_ID" =~ ^[A-Za-z0-9]{20,100}$ && "$SOURCE_READER_INSTALLATION_ID" =~ ^[1-9][0-9]{0,18}$ ]] || exit 1
          [[ "$SOURCE_REPOSITORY_OWNER" =~ ^[A-Za-z0-9_.-]{1,100}$ && "$SOURCE_REPOSITORY_NAME" =~ ^[A-Za-z0-9_.-]{1,100}$ ]] || exit 1
      - name: Mint scoped source-reader token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.SOURCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          permission-metadata: read
          skip-token-revoke: true
      - name: Verify installation identity
        env:
          EXPECTED_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          ACTUAL_INSTALLATION_ID: ${{ steps.source-token.outputs.installation-id }}
        run: |
          set -euo pipefail
          [[ "$ACTUAL_INSTALLATION_ID" == "$EXPECTED_INSTALLATION_ID" ]] || exit 1
      - name: Run and publish encrypted feedback
        id: producer
        env:
          SOURCE_READER_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_READER_INSTALLATION_ID: ${{ vars.SOURCE_READER_INSTALLATION_ID }}
          SOURCE_READER_CLIENT_ID: ${{ vars.SOURCE_READER_CLIENT_ID }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_REPOSITORY_OWNER: ${{ secrets.SOURCE_REPOSITORY_OWNER }}
          SOURCE_REPOSITORY_NAME: ${{ secrets.SOURCE_REPOSITORY_NAME }}
          CORE_CONTRACT_ALLOWED_SHA: ${{ vars.CORE_CONTRACT_ALLOWED_SHA }}
          CORE_CONTRACT_ALLOWED_CONTROL_SHA: ${{ vars.CORE_CONTRACT_ALLOWED_CONTROL_SHA }}
          CORE_CONTRACT_REVIEWED_SOURCE_SHA: ${{ vars.CORE_CONTRACT_REVIEWED_SOURCE_SHA }}
          CORE_CONTRACT_REVIEWED_BASE_SHA: ${{ vars.CORE_CONTRACT_REVIEWED_BASE_SHA }}
          CORE_CONTRACT_REVIEWED_BASE_BRANCH: ${{ vars.CORE_CONTRACT_REVIEWED_BASE_BRANCH }}
          CORE_CONTRACT_REVIEWED_CANDIDATE_REF: ${{ secrets.CORE_CONTRACT_REVIEWED_CANDIDATE_REF }}
          CORE_CONTRACT_REVIEWED_DIFF_SHA256: ${{ vars.CORE_CONTRACT_REVIEWED_DIFF_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" && -n "${RUNNER_TEMP:-}" ]] || exit 1
          capture_dir="$(mktemp -d "${RUNNER_TEMP%/}/feedback-capture.XXXXXX")"
          trap 'rm -rf "$capture_dir"' EXIT
          stdout_file="$capture_dir/driver-stdout"
          stderr_file="$capture_dir/driver-stderr"
          publish_file="$capture_dir/publisher-stdout"
          publish_stderr="$capture_dir/publisher-stderr"
          failure_file="$capture_dir/driver-refusal"
          node_path="$(command -v node)"
          [[ "$node_path" == /* ]] || exit 1
          set +e
          printf '%s' "$SOURCE_READER_TOKEN" | sudo -n -- /usr/bin/env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/var/root LANG=C LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
