            KD_FEEDBACK_RECIPIENT_SPKI_B64="$KD_FEEDBACK_RECIPIENT_SPKI_B64" \
            CORE_CONTRACT_ALLOWED_SHA="$CORE_CONTRACT_ALLOWED_SHA" \
            CORE_CONTRACT_ALLOWED_CONTROL_SHA="$CORE_CONTRACT_ALLOWED_CONTROL_SHA" \
            CORE_CONTRACT_REVIEWED_SOURCE_SHA="$CORE_CONTRACT_REVIEWED_SOURCE_SHA" \
            CORE_CONTRACT_REVIEWED_BASE_SHA="$CORE_CONTRACT_REVIEWED_BASE_SHA" \
            CORE_CONTRACT_REVIEWED_BASE_BRANCH="$CORE_CONTRACT_REVIEWED_BASE_BRANCH" \
            CORE_CONTRACT_REVIEWED_CANDIDATE_REF="$CORE_CONTRACT_REVIEWED_CANDIDATE_REF" \
            CORE_CONTRACT_REVIEWED_DIFF_SHA256="$CORE_CONTRACT_REVIEWED_DIFF_SHA256" \
            SOURCE_REPOSITORY_ID="$SOURCE_REPOSITORY_ID" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_feedback_producer.py publish --profile cargo_lock \
