            CORE_CONTRACT_REVIEWED_SOURCE_SHA="$CORE_CONTRACT_REVIEWED_SOURCE_SHA" \
            CORE_CONTRACT_REVIEWED_BASE_SHA="$CORE_CONTRACT_REVIEWED_BASE_SHA" \
            CORE_CONTRACT_REVIEWED_BASE_BRANCH="$CORE_CONTRACT_REVIEWED_BASE_BRANCH" \
            CORE_CONTRACT_REVIEWED_CANDIDATE_REF="$CORE_CONTRACT_REVIEWED_CANDIDATE_REF" \
            CORE_CONTRACT_REVIEWED_DIFF_SHA256="$CORE_CONTRACT_REVIEWED_DIFF_SHA256" \
            SOURCE_READER_INSTALLATION_ID="$SOURCE_READER_INSTALLATION_ID" \
            SOURCE_READER_CLIENT_ID="$SOURCE_READER_CLIENT_ID" SOURCE_REPOSITORY_ID="$SOURCE_REPOSITORY_ID" \
            SOURCE_REPOSITORY_OWNER="$SOURCE_REPOSITORY_OWNER" SOURCE_REPOSITORY_NAME="$SOURCE_REPOSITORY_NAME" \
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
            -I -S -B kit/confinement/macos_feedback_producer.py run --profile cargo_lock --token-stdin \
            --source-sha "$REQUESTED_SOURCE_SHA" --base-sha "$REQUESTED_BASE_SHA" \
            --base-branch "$REQUESTED_BASE_BRANCH" >"$stdout_file" 2>"$stderr_file"
          driver_status=$?
          set -e
          if [[ "$driver_status" -ne 0 ]]; then
            set +e
            /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9 \
              -I -S -B kit/confinement/feedback_failure.py <"$stdout_file" >"$failure_file" 2>/dev/null
            failure_status=$?
            set -e
            if [[ "$failure_status" -ne 0 || "$(wc -l < "$failure_file")" -ne 1 \
              || "$(wc -c < "$failure_file")" -gt 1024 \
              || "$(wc -c < "$stderr_file")" -gt 65536 ]]; then
              exit 1
            fi
            IFS= read -r refusal_line < "$failure_file"
            [[ "$refusal_line" == KD-FEEDBACK-PRODUCER-REFUSAL\ * ]] || exit 1
            if [[ "$refusal_line" != *'"reason":"cleanup_incomplete"'* && "$refusal_line" != *'"reason":"internal_error"'* && "$refusal_line" != *'"diagnostic":"unavailable","reason":"runner_unavailable","schema_version":1,"stage":"context"'* ]]; then printf 'producer_revocation=confirmed\n' >> "$GITHUB_OUTPUT"; fi
            printf '%s\n' "$refusal_line"
            exit 1
          fi
          if [[ "$(wc -l < "$stdout_file")" -ne 1 \
